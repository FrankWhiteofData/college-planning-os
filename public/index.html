function collegeMetrics(){
  const S=STATE.schools; const bal=listBalance();
  const buckets={"Not Started":0,"In Progress":0,"Ready to Submit":0,"Submitted":0,"Accepted":0,"Waitlisted":0,"Denied":0};
  S.forEach(c=>{ buckets[appBucket(c)]=(buckets[appBucket(c)]||0)+1; });
  const costs=S.map(estTotalCost).filter(x=>x!==null);
  const nets=S.map(estNetCost).filter(x=>x!==null);
  const avgCost=costs.length?Math.round(costs.reduce((a,b)=>a+b,0)/costs.length):null;
  const meritSchools=S.filter(c=>c.merit&&(c.merit.auto||c.merit.competitive||c.merit.maxFourYear||c.merit.fullTuition));
  const bestMerit=meritSchools.sort((a,b)=>meritPotential(b)-meritPotential(a))[0];
  return {total:S.length, favorites:S.filter(c=>c.favorite).length, bal, buckets,
    avgCost, lowNet:nets.length?Math.min(...nets):null, highNet:nets.length?Math.max(...nets):null, bestMerit};
}
function collegeActions(){
  const out=[]; const S=STATE.schools;
  const overdueTasks=STATE.tasks.filter(t=>{const d=daysUntil(t.due);return d!==null&&d<0&&t.status!=="done";});
  if(overdueTasks.length) out.push({ic:"🚨",t:`Clear ${overdueTasks.length} overdue task(s)`,sub:overdueTasks[0].subject,go:"go('tasks')"});
  // soonest college deadline
  let soon=null; S.forEach(c=>{const n=nextCollegeDeadline(c); if(n&&(!soon||n.d<soon.d)) soon={...n,c};});
  if(soon&&soon.d<=45) out.push({ic:"⏰",t:`${soon.c.name}: ${DEADLINE_LABEL[soon.type]||soon.type} in ${soon.d} day(s)`,sub:fmtDate(soon.date),go:`openCollege('${soon.c.id}')`});
  const ready=S.filter(c=>c.status==="READY"); if(ready.length) out.push({ic:"✅",t:`Submit your application to ${ready[0].name}`,sub:"Marked Ready to Submit",go:`openCollege('${ready[0].id}')`});
  const needData=S.filter(c=>admissionsFit(c).tier==="INSUFFICIENT DATA"); if(needData.length) out.push({ic:"🔎",t:`Research admission data for ${needData.length} school(s)`,sub:"Fetch from College Scorecard or enter stats",go:"go('mycolleges')"});
  const fav=S.find(c=>c.favorite&&!["VISITED"].includes(c.status)&&!(c.visits&&c.visits.length)); if(fav) out.push({ic:"🏫",t:`Plan a campus visit to ${fav.name}`,sub:"A favorite you haven't visited",go:`openCollege('${fav.id}')`});
  const target=(STATE.settings.actTargetPrimary||30); const latestACT=[...STATE.actScores].sort((a,b)=>(a.date||"").localeCompare(b.date||"")).pop();
  if(latestACT&&latestACT.composite<target) out.push({ic:"📈",t:`Register for the next ACT (goal ${target}+)`,sub:`Current ${latestACT.composite}`,go:"go('academics')"});
  const essayTask=STATE.tasks.find(t=>t.cat==="Essays"&&t.status!=="done"); if(essayTask) out.push({ic:"✍️",t:essayTask.subject,sub:"Reusable essay work",go:"go('essays')"});
  const topSch=[...STATE.scholarships].filter(s=>s.status==="RESEARCHING"||s.status==="QUALIFIED").sort((a,b)=>opportunityScore(b)-opportunityScore(a))[0];
  if(topSch) out.push({ic:"💰",t:`Pursue scholarship: ${topSch.name.replace(/^SAMPLE — /,'')}`,sub:`Opportunity Score ${opportunityScore(topSch)}`,go:`openScholarshipDetail('${topSch.id}')`});
  return out.slice(0,7);
}

function saveCollegeEdit(id){
  const c=schoolById(id); const g=x=>document.getElementById(x); const gv=x=>g(x)?g(x).value:""; const gc=x=>g(x)?g(x).checked:false;
  c.name=gv("ce_name").trim()||c.name; c.location=gv("ce_location").trim(); c.state=gv("ce_state").trim().toUpperCase(); c.region=regionOf(c.state);
  c.control=gv("ce_control"); c.setting=gv("ce_setting"); c.size=gv("ce_size");
  ["acceptRate","avgGPA","actLow","actHigh","satLow","satHigh","gradRate","enrollment"].forEach(f=>{ c[f]=gv("ce_"+f); });
  c.testPolicy=gv("ce_testPolicy");
  c.req.platform=gv("ce_req_platform"); c.req.teacherRecs=gv("ce_req_teacherRecs"); c.req.counselorRec=gc("ce_req_counselorRec"); c.req.interview=gc("ce_req_interview"); c.req.portfolio=gc("ce_req_portfolio"); c.req.superscore=gc("ce_req_superscore");
  ["ea","ed","edii","priority","rd","merit","honors","aid","deposit","decision"].forEach(k=>{ c.deadlines[k]=gv("ce_dl_"+k); });
  ["auto","competitive","fullTuition","fullRide","separateApp","honors"].forEach(k=>{ c.merit[k]=gc("ce_merit_"+k); });
  c.merit.maxFourYear=gv("ce_merit_maxFourYear"); c.merit.source=gv("ce_merit_source");
  c.majors=gv("ce_majors");
  ["exSci","kines","dpt","threeThree","directAdmit","earlyAssure"].forEach(k=>{ c.pt[k]=gc("ce_pt_"+k); });
  c.value={}; VALUE_FACTORS.forEach(vf=>{ const el=g("ceval_"+VALUE_FACTORS.indexOf(vf)); if(el) c.value[vf]=el.value; });
  c.verify=gv("ce_verify"); c.lastVerified=isoToday(); if(c._statsSample && (c.acceptRate||c.actLow)) c._statsSample=false;
  saveState(); openCollege(id); toast("Saved");
}

function collectDeadlines(){
  const out=[];
  STATE.schools.forEach(c=>Object.entries(c.deadlines||{}).forEach(([k,v])=>{ const d=daysUntil(v); if(d!==null) out.push({label:c.name+" — "+(DEADLINE_LABEL[k]||k),date:v,days:d,type:k,cat:/merit|honors|aid/.test(k)?"merit":/decision|deposit/.test(k)?"decision":"application",go:`openCollege('${c.id}')`}); }));
  STATE.scholarships.forEach(s=>{ const d=daysUntil(s.deadline); if(d!==null&&!["WON","NOT_SELECTED","NOT_ELIGIBLE"].includes(s.status)) out.push({label:s.name.replace(/^SAMPLE — /,'')+" (scholarship)",date:s.deadline,days:d,type:"scholarship",cat:"scholarship",go:`openScholarshipDetail('${s.id}')`}); });
  return out.sort((a,b)=>a.days-b.days);
}

/* ---- Find Colleges ---- */
function localFind(st){ let list=US_COLLEGES.slice(); const q=(st.q||"").trim().toLowerCase();
  if(q) list=list.filter(c=>c.lc.includes(q)); if(st.state) list=list.filter(c=>c.st===st.state.toUpperCase());
  list.sort((a,b)=>{const A=a.lc.startsWith(q)?0:1,B=b.lc.startsWith(q)?0:1;return A-B||a.name.length-b.name.length;});
  return list.slice(0,40).map(c=>({name:c.name,state:c.st,_src:"local"})); }
async function findSearch(){ const st=VIEWSTATE.find; st.loading=true; render();
  try{ const r=await apiSearchColleges({name:st.q,state:st.state,control:st.control}); st.mode=r.source||"scorecard"; st.results=r.results||[]; st.msg=r.note||""; }
  catch(e){ st.mode="local"; st.results=localFind(st);
    st.msg = e.message==="NOT_CONFIGURED" ? "The server has no College Scorecard API key configured yet — showing the built-in list. See Settings → Data Sources."
      : e.message==="RATE_LIMITED" ? "College Scorecard rate limit reached — showing the built-in list; try again shortly."
      : "Live search unavailable — showing the built-in list. (Live data requires the Node server running with an API key.)"; }
  st.loading=false; render();
}
/* Apply a normalized Scorecard record with field-level provenance; never overwrite better data, never fabricate. */
function applyScorecardRecord(c,r){ const now=new Date().toISOString(); const yr=r.dataYear||"";
  if(r.name) c.name=c.name||r.name; if(r.state){ c.state=r.state; c.region=regionOf(r.state); }
  if(r.city||r.state) c.location=c.location||[r.city,r.state].filter(Boolean).join(", ");
  c.unitid=r.unitid||c.unitid; c.scorecardId=r.id||r.scorecardId||c.scorecardId; c.website=r.website||c.website;
  if(r.control) c.control=r.control; if(r.setting) c.setting=r.setting; if(r.size) c.size=r.size;
  const put=(field,val)=>{ if(val===null||val===undefined||val==="") return; const s=(c.sources||{})[field]; if(s&&["MANUAL_ENTRY","VERIFIED","CDS"].includes(s.verificationStatus)) return;
    c[field]=val; setSource(c,field,{source:"COLLEGE_SCORECARD",sourceYear:yr,retrievedAt:now,sourceUrl:"https://collegescorecard.ed.gov/",verificationStatus:"API_DATA"}); };
  put("acceptRate",r.acceptRate); put("enrollment",r.enrollment); put("gradRate",r.gradRate); put("retention",r.retention);
  if(r.actLow!=null&&r.actHigh!=null){ put("actLow",r.actLow); put("actHigh",r.actHigh); }
  if(r.satLow!=null&&r.satHigh!=null){ put("satLow",r.satLow); put("satHigh",r.satHigh); }
  if(r.cost!=null){ const s=(c.sources||{}).cost; if(!s||!["MANUAL_ENTRY","VERIFIED","CDS"].includes(s.verificationStatus)){ c.cost.outState=r.cost; setSource(c,"cost",{source:"COLLEGE_SCORECARD",sourceYear:yr,retrievedAt:now,verificationStatus:"API_DATA"}); } }
  c.identityOnly=false; c.scorecardAt=now; c.dataYear=yr; return c; }
function addFindResult(i){ const st=VIEWSTATE.find; const r=st.results[i]; if(!r) return;
  const dup=STATE.schools.find(s=>(r.unitid&&s.unitid&&String(s.unitid)===String(r.unitid))||(r.id&&s.scorecardId&&String(s.scorecardId)===String(r.id))||s.name.toLowerCase()===(r.name||"").toLowerCase());
  if(dup){ toast("Already on your list"); return; }
  const c=applyScorecardRecord(newCollege({status:"INTERESTED"}),r); STATE.schools.push(c); saveState(); render(); toast("Added "+r.name); }
async function refreshCollegeScorecard(id){ const c=schoolById(id); if(!c) return; toast("Refreshing from College Scorecard…");
  try{ let rec=null; if(c.scorecardId){ rec=await apiGetCollege(c.scorecardId); } else { const r=await apiSearchColleges({name:c.name,state:c.state}); rec=(r.results||[]).find(x=>(x.name||"").toLowerCase()===c.name.toLowerCase())||(r.results||[])[0]; }
    if(!rec){ toast("No College Scorecard match found for "+c.name); return; }
    const before={acceptRate:c.acceptRate,gradRate:c.gradRate,enrollment:c.enrollment,act:(c.actLow&&c.actHigh)?c.actLow+"–"+c.actHigh:""};
    applyScorecardRecord(c,rec); saveState();
    const after={acceptRate:c.acceptRate,gradRate:c.gradRate,enrollment:c.enrollment,act:(c.actLow&&c.actHigh)?c.actLow+"–"+c.actHigh:""};
    const line=(l,b,a)=>`<div class="spread" style="padding:5px 0;border-bottom:1px solid var(--line-2);font-size:13px"><span class="muted">${l}</span><span>${String(b||"")===String(a||"")?'<span class="muted">no change</span> '+(a?esc(String(a)):""):`<b>${esc(String(b||"—"))} → ${esc(String(a||"—"))}</b>`}</span></div>`;
    openInfoModal("Refreshed — "+esc(c.name), line("Acceptance rate",before.acceptRate?before.acceptRate+"%":"",after.acceptRate?after.acceptRate+"%":"")+line("ACT middle 50%",before.act,after.act)+line("Graduation rate",before.gradRate?before.gradRate+"%":"",after.gradRate?after.gradRate+"%":"")+line("Enrollment",before.enrollment,after.enrollment)+`<div class="muted" style="font-size:11.5px;margin-top:10px">Data year ${esc(c.dataYear||"—")} · retrieved just now. Manually verified fields are never overwritten by older API data.</div>`);
    render();
  }catch(e){ toast(e.message==="NOT_CONFIGURED"?"Server has no API key configured (Settings → Data Sources).":"Refresh failed — is the server running? ("+e.message+")"); } }

VIEWS.deadlines=function(){
  const f=VIEWSTATE.dlCat||(VIEWSTATE.dlCat="all");
  let all=collectDeadlines(); if(f!=="all") all=all.filter(d=>d.cat===f);
  const semEnd=Math.max(semesterEndDays(),61);
  const B={OVERDUE:[],TODAY:[],"NEXT 7 DAYS":[],"NEXT 30 DAYS":[],"NEXT 60 DAYS":[],"THIS SEMESTER":[],LATER:[]};
  all.forEach(d=>{ if(d.days<0)B.OVERDUE.push(d); else if(d.days===0)B.TODAY.push(d); else if(d.days<=7)B["NEXT 7 DAYS"].push(d); else if(d.days<=30)B["NEXT 30 DAYS"].push(d); else if(d.days<=60)B["NEXT 60 DAYS"].push(d); else if(d.days<=semEnd)B["THIS SEMESTER"].push(d); else B.LATER.push(d); });
  const catPill={application:"blue",merit:"purple",scholarship:"green",decision:"info"};
  const sec=(title,ic,cls)=>{ const arr=B[title]; if(!arr.length&&title!=="OVERDUE") return ""; if(!arr.length) return "";
    return `<div class="card" style="margin-bottom:14px"><div class="spread pad" style="padding-bottom:10px"><div class="wrapflex"><span>${ic}</span><h3 style="font-size:15px">${title}</h3><span class="pill ${cls}">${arr.length}</span></div></div>
      <div class="rows">${arr.map(d=>`<div class="row clickable" style="grid-template-columns:1fr 130px 110px" onclick="${d.go}"><div style="min-width:0"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(d.label)}</div><div class="muted" style="font-size:12px">${fmtDate(d.date)}</div></div><div><span class="pill ${catPill[d.cat]||'gray'}">${d.cat}</span></div><div>${daysBadge(d.days)}</div></div>`).join("")}</div></div>`; };
  return `<div class="page-head"><div><div class="t">Deadline Center</div><div class="d">Every deadline — applications, merit, scholarships, decisions — in one place.</div></div></div>
  <div class="card pad" style="margin-bottom:16px"><div class="chips">
    ${[["all","All"],["application","Applications"],["merit","Merit"],["scholarship","Scholarships"],["decision","Decisions"]].map(c=>`<button class="chip ${f===c[0]?'on':''}" onclick="VIEWSTATE.dlCat='${c[0]}';render()">${c[1]}</button>`).join("")}
  </div></div>
  ${B.OVERDUE.length?`<div class="notice" style="background:var(--bad-soft);border-color:#f3caca;color:#b91c1c;margin-bottom:14px">🚨 ${B.OVERDUE.length} overdue item(s) — update status or confirm if a date moved.</div>`:""}
  ${sec("OVERDUE","🚨","red")}${sec("TODAY","🔥","red")}${sec("NEXT 7 DAYS","⏰","red")}${sec("NEXT 30 DAYS","📅","amber")}${sec("NEXT 60 DAYS","🗓️","info")}${sec("THIS SEMESTER","📖","blue")}${sec("LATER","🌙","gray")}
  ${all.length===0?`<div class="empty">No deadlines yet — add them in each college's profile (Edit data) or the Scholarships module.</div>`:""}`;
};

function researchQueue(){
  const items=[];
  STATE.schools.forEach(c=>{ const add=(what)=>items.push({college:c,what,id:c.id});
    if(!hasAdmissionsData(c)) add("Load admissions statistics (Refresh Public Data)");
    if(!c.testPolicy&&!c.req.testPolicy) add("Confirm current test policy");
    if(!Object.values(c.deadlines).some(Boolean)) add("Add current application & merit deadlines");
    if(!(c.merit.auto||c.merit.competitive||c.merit.maxFourYear)) add("Research merit scholarships");
    if(!c.req.platform) add("Confirm application platform & requirements");
    if(estTotalCost(c)===null) add("Enter cost of attendance");
    if(!c.majors) add("Confirm major availability");
    if(!(c.visits&&c.visits.length)&&c.favorite) add("Schedule a campus visit");
  });
  return items;
}

    ${F("inState","In-state total")}${F("outState","Out-of-state total")}${F("tuition","Tuition")}${F("fees","Fees")}${F("housing","Housing")}${F("meals","Meal plan")}${F("books","Books")}${F("travel","Travel")}
    <div class="fieldset-title">Aid (estimated)</div>${F("instMerit","Institutional merit")}${F("outsideSch","Outside scholarships")}${F("grants","Grants")}${F("otherAid","Other aid")}
  </div><div class="muted" style="font-size:12px;margin-top:8px">Leave blank if unknown — blanks are treated as “not reported,” never $0.</div></div>
  <div class="modal-foot"><span></span><div class="wrapflex"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveCost('${id}')">Save</button></div></div>`);
}
function saveCost(id){ const c=schoolById(id); ["inState","outState","tuition","fees","housing","meals","books","travel","instMerit","outsideSch","grants","otherAid"].forEach(f=>{ const el=document.getElementById("co_"+f); c.cost[f]=el.value; if(el.value) setSource(c,"cost",{source:"Manual entry",verificationStatus:"MANUAL_ENTRY",retrievedAt:isoToday()}); }); saveState(); closeModal(); render(); toast("Cost saved"); }
function openOfferEdit(id){ const c=schoolById(id); const o=c.offer; const F=(f,l)=>`<div class="f"><label>${l}</label><input id="of_${f}" type="number" value="${o[f]||""}"></div>`;
  openModal(`<div class="modal-head"><h3>Confirmed Aid Offer — ${esc(c.name)}</h3><button class="x" onclick="closeModal()">✕</button></div>
  <div class="modal-body"><div class="notice" style="margin-bottom:12px">Enter figures from the official financial-aid offer only.</div><div class="form-grid">
    ${F("coa","Cost of attendance")}${F("merit","Merit scholarship")}${F("grants","Grants")}${F("loans","Loans")}${F("netFamily","Net family cost")}
  </div></div>
  <div class="modal-foot"><span></span><div class="wrapflex"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveOffer('${id}')">Save offer</button></div></div>`);
}
function saveOffer(id){ const c=schoolById(id); ["coa","merit","grants","loans","netFamily"].forEach(f=>{ c.offer[f]=document.getElementById("of_"+f).value; }); c.offer.received=true; saveState(); closeModal(); render(); toast("Offer saved"); }

/* ---- Settings (Student Profile · Fit Weights · Data Sources · Data) ---- */
VIEWS.settings=function(){
  const p=STATE.profile, w=STATE.settings.fitWeights||DEFAULT_FIT_WEIGHTS;
  const F=(id,l,v,t)=>`<div class="f"><label>${l}</label><input id="${id}" ${t?`type="${t}"`:""} value="${esc(v==null?"":v)}"></div>`;
  const cds=STATE.schools.filter(c=>Object.values(c.value||{}).some(x=>x&&x!=="NOT REPORTED")).length;
  const loaded=STATE.schools.filter(hasAdmissionsData).length;
  return `<div class="page-head"><div><div class="t">Settings</div><div class="d">Your profile drives fit; data sources power live college data.</div></div></div>
  <div class="grid two">
    <div class="stack">
      <div class="card pad"><div class="section-title">Student Profile</div><div class="form-grid">
        ${F("s_name","Name",p.name)}${F("s_grad","HS graduation year",p.gradYear,"number")}
        ${F("s_entry","College entry year",p.collegeEntry,"number")}${F("s_state","Home state",p.state)}
        ${F("s_city","City",p.city)}${F("s_county","County",p.county)}
        ${F("s_gpaU","Unweighted GPA",p.gpaUnweighted)}${F("s_gpaW","Weighted GPA",p.gpaWeighted)}
        ${F("s_rank","Class rank",p.classRank)}${F("s_size","Class size",p.classSize)}
        ${F("s_act","ACT composite",p.actComposite,"number")}${F("s_sat","SAT total",p.sat,"number")}
        ${F("s_ap","AP courses",p.apCourses)}${F("s_honors","Honors courses",p.honorsCourses)}
        ${F("s_dual","Dual enrollment",p.dualCourses)}${F("s_rigor","Course rigor",p.rigor)}
        <div class="f full"><label>Intended majors (comma-sep)</label><input id="s_majors" value="${esc((p.majors||[]).join(', '))}"></div>
        <div class="f full"><label>Career interests</label><input id="s_career" value="${esc(p.careerInterests||"")}"></div>
        <div class="f full"><label>Academic awards</label><textarea id="s_awards" style="min-height:44px">${esc(p.awards||"")}</textarea></div>
        <div class="f full"><label>Activities, leadership, service, work, sports</label><textarea id="s_activities" style="min-height:56px">${esc(p.activities||"")}</textarea></div>
      </div><button class="btn primary" style="margin-top:12px" onclick="saveProfileV2()">Save profile</button></div>

      <div class="card pad"><div class="section-title">College Fit — Weighting</div>
        <div class="muted" style="font-size:12px;margin-bottom:10px">Tune how much each factor counts in the 0–100 College Fit Score.</div>
        ${FIT_DIMS.map(d=>`<div class="spread" style="padding:5px 0"><span style="font-size:13px;font-weight:550">${d.label}</span><input type="range" min="0" max="10" value="${w[d.k]}" oninput="setFitWeight('${d.k}',this.value);this.nextElementSibling.textContent=this.value" style="width:150px"><b class="mono" style="width:18px;text-align:right">${w[d.k]}</b></div>`).join("")}
        <button class="btn sm" style="margin-top:10px" onclick="STATE.settings.fitWeights={...DEFAULT_FIT_WEIGHTS};saveState();render()">Reset weights</button>
      </div>
    </div>
    <div class="stack">
      <div class="card pad"><div class="section-title">Data Sources</div>
        <div id="ds_scorecard" class="card pad" style="box-shadow:none;background:var(--surface-2)"><div class="spread"><b>College Scorecard</b><span class="pill gray">checking…</span></div><div class="muted" style="font-size:12px;margin-top:6px">Checking server…</div></div>
        <div class="wrapflex" style="margin:12px 0"><button class="btn sm primary" onclick="doTestConnection()">Test Connection</button><span id="ds_test" class="muted" style="font-size:12.5px"></span></div>
        <div class="card pad" style="box-shadow:none;margin-bottom:8px"><div class="spread"><b>IPEDS</b><span class="pill gray">Not imported</span></div><div class="muted" style="font-size:12px;margin-top:4px">Historical statistics — import layer prepared for later.</div></div>
        <div class="card pad" style="box-shadow:none;margin-bottom:8px"><div class="spread"><b>Common Data Set</b><span class="pill ${cds?'blue':'gray'}">${cds} / ${STATE.schools.length} colleges</span></div><div class="muted" style="font-size:12px;margin-top:4px">Detailed admissions factors ("what they value").</div></div>
        <div class="card pad" style="box-shadow:none"><div class="spread"><b>Admissions data loaded</b><span class="pill ${loaded?'blue':'gray'}">${loaded} / ${STATE.schools.length} colleges</span></div></div>
        <div class="muted" style="font-size:11.5px;margin-top:10px">The API key is stored server-side only (environment variable <b>COLLEGE_SCORECARD_API_KEY</b>) — never shown here.</div>
      </div>
      <div class="card pad"><div class="section-title">Data Management</div>
        <div class="wrapflex"><button class="btn" onclick="exportJSON()">⇩ Export JSON</button><button class="btn" onclick="exportCSV()">⇩ Scholarships CSV</button><button class="btn" onclick="openImport()">⇧ Import</button></div>
        <hr class="hr" style="margin:14px 0"><div class="wrapflex"><button class="btn" onclick="resetToSample()">↺ Reset sample data</button><button class="btn danger" onclick="if(confirm('Erase ALL data?'))clearAll()">🗑 Clear all</button></div>
      </div>
      <div class="card pad"><div class="section-title">Core Principle</div><div class="muted" style="font-size:12.5px;line-height:1.6"><b>Missing data is better than wrong data.</b> Real colleges show only verified/API/official/manual data or “Data not yet loaded.” Derived scores refuse to compute from missing inputs. Fictional demo institutions are clearly labeled <b>DEMO</b>.</div></div>
    </div>
  </div>`;
};
AFTER.settings=function(){ loadDataSourceStatus(); };
async function loadDataSourceStatus(){ const el=document.getElementById("ds_scorecard"); if(!el) return;
  try{ const s=await apiDataSourceStatus(); const sc=s.scorecard||{}; const st=sc.status||"NOT_CONFIGURED";
    const pill=st==="CONNECTED"?'<span class="pill green">CONNECTED</span>':st==="NOT_CONFIGURED"?'<span class="pill amber">NOT CONFIGURED</span>':'<span class="pill red">ERROR</span>';
    el.innerHTML=`<div class="spread"><b>College Scorecard</b>${pill}</div>
      <div style="font-size:12px;margin-top:8px" class="mono">
        <div class="spread" style="padding:2px 0"><span class="muted">API key</span><b>${sc.keyConfigured?"Configured ✓":"Missing"}</b></div>
        <div class="spread" style="padding:2px 0"><span class="muted">Last successful request</span><b>${sc.lastSuccess?new Date(sc.lastSuccess).toLocaleString():"—"}</b></div>
        <div class="spread" style="padding:2px 0"><span class="muted">API status</span><b>${esc(sc.message||st)}</b></div>
      </div>`;
  }catch(e){ el.innerHTML=`<div class="spread"><b>College Scorecard</b><span class="pill red">SERVER UNREACHABLE</span></div><div class="muted" style="font-size:12px;margin-top:6px">The app is running without its Node server (offline mode). Live college data needs the server. See the README / ACTION REQUIRED.</div>`; }
}
async function doTestConnection(){ const el=document.getElementById("ds_test"); if(el)el.textContent="Testing…";
  try{ const r=await apiTestConnection(); el.innerHTML = r.ok?'<span style="color:var(--good);font-weight:600">✓ College Scorecard connected</span>':'<span style="color:var(--bad)">'+esc(r.error||"Failed")+'</span>'; loadDataSourceStatus(); }
  catch(e){ el.innerHTML='<span style="color:var(--bad)">'+esc(e.message==="NOT_CONFIGURED"?"No API key configured on server":("Failed: "+e.message))+'</span>'; }
}
function setFitWeight(k,v){ STATE.settings.fitWeights[k]=Number(v)||0; saveState(); }
function saveProfileV2(){ const g=x=>{const el=document.getElementById(x);return el?el.value:"";}; const p=STATE.profile;
  p.name=g("s_name").trim()||"Student"; p.gradYear=Number(g("s_grad"))||p.gradYear; p.collegeEntry=Number(g("s_entry"))||p.collegeEntry;
  p.state=g("s_state").trim().toUpperCase(); p.city=g("s_city").trim(); p.county=g("s_county").trim();
  p.gpaUnweighted=g("s_gpaU"); p.gpa=p.gpaUnweighted; p.gpaWeighted=g("s_gpaW"); p.classRank=g("s_rank"); p.classSize=g("s_size");
  p.actComposite=Number(g("s_act"))||0; p.sat=g("s_sat"); p.apCourses=g("s_ap"); p.honorsCourses=g("s_honors"); p.dualCourses=g("s_dual"); p.rigor=g("s_rigor");
  p.majors=g("s_majors").split(",").map(s=>s.trim()).filter(Boolean); p.careerInterests=g("s_career"); p.awards=g("s_awards"); p.activities=g("s_activities");
  saveState(); render(); toast("Profile saved"); }

/* ---- Visits ---- */
VIEWS.visits=function(){
  const all=[]; STATE.schools.forEach(c=>(c.visits||[]).forEach(v=>all.push({c,v})));
  all.sort((a,b)=>(b.v.date||"").localeCompare(a.v.date||""));
  const notVisited=STATE.schools.filter(c=>!(c.visits&&c.visits.length));
  return `<div class="page-head"><div><div class="t">Campus Visits</div><div class="d">Log tours and impressions — visits can inform your ratings and final decision.</div></div></div>
  <div class="card" style="margin-bottom:16px"><div class="spread pad" style="padding-bottom:10px"><div class="section-title" style="margin:0">Logged Visits</div><span class="tag">${all.length}</span></div>
    <div class="rows">${all.map(x=>`<div class="row clickable" style="grid-template-columns:1.3fr 130px 1fr auto" onclick="openCollege('${x.c.id}')">
      <div><div style="font-weight:650">${esc(x.c.name)}</div><div class="muted" style="font-size:12px">${esc(x.v.type||"Visit")}</div></div>
      <div style="font-size:12.5px">${fmtDate(x.v.date)}</div>
      <div style="font-size:12.5px">${"★".repeat(x.v.rating||0)}${"☆".repeat(5-(x.v.rating||0))} ${x.v.see?('· '+esc(x.v.see)):""}${x.v.notes?" · "+esc(x.v.notes.slice(0,60)):""}</div>
      <div><button class="btn ghost sm" onclick="event.stopPropagation();openVisitModal('${x.c.id}','${x.v.id}')">Edit</button></div>
    </div>`).join("")||`<div class="empty">No visits logged yet — open a college to log one, or pick from below.</div>`}</div></div>
  <div class="card pad"><div class="section-title">Not Yet Visited</div><div class="wrapflex">${notVisited.map(c=>`<button class="chip" onclick="openVisitModal('${c.id}')">${esc(c.name.split(",")[0])} +</button>`).join("")||'<span class="muted">All tracked schools have a visit logged.</span>'}</div></div>`;
};

/* ============================================================
   EXPORT / IMPORT
============================================================ */
function download(filename,text,type){ const blob=new Blob([text],{type:type||"text/plain"}); const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); }
function exportJSON(){ download(`scholarship-command-center-${isoToday()}.json`, JSON.stringify(STATE,null,2), "application/json"); toast("Exported JSON"); }
const CSV_COLS=["name","org","categories","awardAmount","renewable","renewYears","fourYearValue","openDate","deadline","daysRemaining","opportunityScore","priority","status","minGPA","actReq","satReq","residencyReq","majorReq","leadershipReq","serviceReq","womenOnly","essayReq","essayWords","essayPrompt","recReq","transcriptReq","fafsaReq","separateApp","signature","competition","effort","url","verify","lastVerified","dateSubmitted","result","awardReceived","notes"];
function csvCell(v){ if(v===null||v===undefined) v=""; if(Array.isArray(v)) v=v.join("; "); v=String(v); if(/[",\n]/.test(v)) v='"'+v.replace(/"/g,'""')+'"'; return v; }
function exportCSV(){
  const rows=[CSV_COLS.join(",")];
  STATE.scholarships.forEach(s=>{ const rec={...s,categories:(s.categories||[]).join("; "),fourYearValue:fourYearValue(s),daysRemaining:daysUntil(s.deadline),opportunityScore:opportunityScore(s)};
    rows.push(CSV_COLS.map(c=>csvCell(rec[c])).join(",")); });
  download(`scholarships-${isoToday()}.csv`, rows.join("\n"), "text/csv"); toast("Exported CSV");
}
function exportMenu(){
  openModal(`<div class="modal-head"><h3>Export Data</h3><button class="x" onclick="closeModal()">✕</button></div>
  <div class="modal-body"><div class="stack">
    <div class="linkrow"><div><div style="font-weight:600">Full backup (JSON)</div><div class="muted" style="font-size:12px">Everything — scholarships, colleges, tasks, essays, ACT, profile. Re-importable.</div></div><button class="btn primary sm" onclick="exportJSON();closeModal()">Download</button></div>
    <div class="linkrow"><div><div style="font-weight:600">Scholarships (CSV)</div><div class="muted" style="font-size:12px">Spreadsheet-friendly, includes computed Opportunity Score, 4-yr value & days remaining.</div></div><button class="btn primary sm" onclick="exportCSV();closeModal()">Download</button></div>
  </div></div>`);
}
function openImport(){
  openModal(`<div class="modal-head"><h3>Import Data</h3><button class="x" onclick="closeModal()">✕</button></div>
  <div class="modal-body">
    <div class="notice" style="margin-bottom:14px">Import a JSON backup (full replace) or a scholarships CSV (adds rows). Export first if you want a safety copy.</div>
    <div class="f full" style="margin-bottom:12px"><label>Choose file (.json or .csv)</label><input type="file" id="imp_file" accept=".json,.csv" onchange="handleFile(event)"></div>
    <div class="f full"><label>…or paste JSON / CSV</label><textarea id="imp_text" style="min-height:120px" placeholder="Paste content here"></textarea></div>
    <div id="imp_status" class="muted" style="font-size:12.5px;margin-top:8px"></div>
  </div>
  <div class="modal-foot"><span></span><div class="wrapflex"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="runImport()">Import</button></div></div>`);
}
function handleFile(ev){ const f=ev.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=e=>{ document.getElementById("imp_text").value=e.target.result; document.getElementById("imp_status").textContent=`Loaded ${f.name} (${(f.size/1024).toFixed(1)} KB) — click Import.`; }; r.readAsText(f); }
function runImport(){
  const txt=document.getElementById("imp_text").value.trim(); if(!txt){ toast("Nothing to import"); return; }
  try{
    if(txt[0]==="{"){ const data=JSON.parse(txt);
      if(!data.scholarships) throw new Error("Not a valid backup (missing scholarships).");
      if(!confirm("Replace ALL current data with this backup?")) return;
      STATE=Object.assign({profile:{...DEFAULT_PROFILE},scholarships:[],colleges:[],schools:null,tasks:[],essays:[],actScores:[],costs:{},wishlist:[],prefs:defaultPrefs(),settings:{actTargetPrimary:30,actTargetNext:32,actTargetStretch:33,fitWeights:{...DEFAULT_FIT_WEIGHTS}},meta:{}},data);
      ensureProfileFields(); if(!Array.isArray(STATE.schools)){ STATE.schools=null; migrateV2(); } if(!STATE.settings.fitWeights)STATE.settings.fitWeights={...DEFAULT_FIT_WEIGHTS};
      saveState(); closeModal(); render(); toast("Backup imported");
    } else {
      const added=importScholarshipCSV(txt);
      saveState(); closeModal(); render(); toast(`Imported ${added} scholarship(s)`);
    }
  }catch(e){ document.getElementById("imp_status").innerHTML=`<span style="color:var(--bad)">Import failed: ${esc(e.message)}</span>`; }
}
function parseCSV(text){
  const rows=[]; let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else{ if(c==='"') q=true; else if(c===","){ row.push(cell); cell=""; } else if(c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n")i++; row.push(cell); rows.push(row); row=[]; cell=""; } else cell+=c; } }
  if(cell.length||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}
function importScholarshipCSV(text){
  const rows=parseCSV(text); if(rows.length<2) throw new Error("CSV needs a header row and at least one data row.");
  const head=rows[0].map(h=>h.trim()); const idx=n=>head.indexOf(n);
  let added=0;
  for(let i=1;i<rows.length;i++){ const r=rows[i]; const get=n=>{const j=idx(n);return j>=0?(r[j]||"").trim():"";};
    const name=get("name"); if(!name) continue;
    const truthy=v=>/^(true|yes|1|y)$/i.test(v);
    STATE.scholarships.push({ id:uid("sch"), sample:false, name, org:get("org"),
      categories:(get("categories")||"").split(/;\s*/).filter(Boolean),
      awardAmount:Number(get("awardAmount"))||0, renewable:truthy(get("renewable")), renewYears:Number(get("renewYears"))||4,
      openDate:get("openDate"), deadline:get("deadline"), minGPA:get("minGPA"), actReq:get("actReq"), satReq:get("satReq"),
      residencyReq:get("residencyReq")||"None", majorReq:get("majorReq"), leadershipReq:truthy(get("leadershipReq")),
      serviceReq:truthy(get("serviceReq")), womenOnly:truthy(get("womenOnly")), essayReq:truthy(get("essayReq")),
      essayWords:get("essayWords"), essayPrompt:get("essayPrompt"), recReq:truthy(get("recReq")), transcriptReq:truthy(get("transcriptReq")),
      fafsaReq:truthy(get("fafsaReq")), separateApp:truthy(get("separateApp")), signature:truthy(get("signature")), fullTuition:false,
      competition:get("competition")||"Moderate", effort:get("effort")||"Medium", priority:get("priority")||"C",
      status:get("status")||"RESEARCHING", url:get("url"), verify:get("verify")||"need", lastVerified:get("lastVerified")||isoToday(),
      dateSubmitted:get("dateSubmitted"), result:get("result"), awardReceived:get("awardReceived"), notes:get("notes"), checklist:{} });
    added++;
  }
  if(!added) throw new Error("No valid rows found (need a 'name' column).");
  return added;
}

/* ============================================================
   INIT
============================================================ */
loadState();
if(!STATE.settings) STATE.settings={actTargetPrimary:30,actTargetNext:32,actTargetStretch:33};
if(!STATE.costs) STATE.costs={};
if(!STATE.wishlist) STATE.wishlist=[];
if(STATE.profile && STATE.profile.activities===undefined) STATE.profile.activities="";
if(!STATE.prefs) STATE.prefs=defaultPrefs();
ensureProfileFields();
if(!STATE.settings.fitWeights) STATE.settings.fitWeights={...DEFAULT_FIT_WEIGHTS};
delete STATE.settings.scorecardKey; // API key must never live in the browser/localStorage
migrateV2();
saveState();
render();
if(!STATE.prefs.completed) setTimeout(openQuiz, 350);

</script>
