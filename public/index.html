<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Planning OS — Class of 2028</title>
<style>
:root{
  --bg:#f7f7f9; --surface:#ffffff; --surface-2:#fbfbfd; --ink:#16181d; --ink-2:#4b5563;
  --ink-3:#8a919e; --line:#e8e9ee; --line-2:#eef0f4; --brand:#3d5afe; --brand-ink:#2a3fb8;
  --brand-soft:#eef1ff; --good:#16a34a; --good-soft:#e9f7ef; --warn:#d97706; --warn-soft:#fdf2e2;
  --bad:#dc2626; --bad-soft:#fdecec; --info:#0891b2; --info-soft:#e6f6fa; --purple:#7c3aed; --purple-soft:#f1eafe;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --shadow-lg:0 4px 12px rgba(16,24,40,.06),0 12px 32px rgba(16,24,40,.08);
  --r:14px; --r-sm:10px; --r-xs:7px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer}
a{color:var(--brand);text-decoration:none}
input,select,textarea{font-family:inherit;font-size:14px}
::selection{background:var(--brand-soft)}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em;color:var(--ink)}
.muted{color:var(--ink-3)}
.mono{font-variant-numeric:tabular-nums}

/* Layout */
.app{max-width:1400px;margin:0 auto;padding:0 26px 90px}
.topbar{position:sticky;top:0;z-index:40;background:rgba(247,247,249,.82);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);}
.topbar-inner{max-width:1400px;margin:0 auto;padding:14px 26px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#3d5afe,#6b7cff);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:750;font-size:15px;flex:none;box-shadow:0 2px 8px rgba(61,90,254,.32)}
.brand h1{font-size:15px;line-height:1.15}
.brand .sub{font-size:11.5px;color:var(--ink-3);font-weight:500}
.topbar-spacer{flex:1}
.gsearch{position:relative;flex:1;max-width:340px}
.gsearch input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);background:var(--surface);border-radius:9px;color:var(--ink)}
.gsearch input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.gsearch .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.topbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);padding:8px 12px;border-radius:9px;font-weight:550;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.topbtn:hover{border-color:#d7d9e0;color:var(--ink)}
.topbtn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(61,90,254,.28)}
.topbtn.primary:hover{background:#3550f0}

/* Nav */
.nav{display:flex;gap:2px;overflow-x:auto;padding:10px 0 0;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:8px 13px;border-radius:9px;color:var(--ink-2);font-weight:550;font-size:13.5px;white-space:nowrap;display:flex;align-items:center;gap:7px;transition:background .12s}
.nav a:hover{background:#eef0f4}
.nav a.active{background:var(--ink);color:#fff}
.nav a .cnt{font-size:11px;background:rgba(0,0,0,.06);padding:1px 6px;border-radius:20px;font-weight:600}
.nav a.active .cnt{background:rgba(255,255,255,.18)}

/* Page */
.page{padding-top:24px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head .t{font-size:23px}
.page-head .d{color:var(--ink-3);font-size:13.5px;margin-top:3px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card.pad{padding:18px}
.grid{display:grid;gap:16px}
.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:0 0 12px}
.stack{display:flex;flex-direction:column;gap:16px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .lbl{font-size:11px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.03em;padding-right:36px;min-height:26px;line-height:1.25}
.kpi .val{font-size:26px;font-weight:720;margin-top:8px;letter-spacing:-.02em}
.kpi .foot{font-size:11.5px;color:var(--ink-3);margin-top:5px}
.kpi .ic{position:absolute;right:14px;top:14px;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
.kpi.hot .val{color:var(--bad)}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:650;white-space:nowrap;line-height:1.4}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.gray{background:#eef0f4;color:#5b6472}
.pill.blue{background:var(--brand-soft);color:var(--brand-ink)}
.pill.green{background:var(--good-soft);color:#15803d}
.pill.amber{background:var(--warn-soft);color:#b45309}
.pill.red{background:var(--bad-soft);color:#b91c1c}
.pill.info{background:var(--info-soft);color:#0e7490}
.pill.purple{background:var(--purple-soft);color:#6d28d9}
.pill.outline{background:transparent;border:1px solid var(--line);color:var(--ink-2)}

/* Progress */
.bar{height:8px;background:#edeef2;border-radius:20px;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:20px;background:var(--brand);transition:width .4s}
.bar.thin{height:6px}
.bar > i.good{background:var(--good)} .bar > i.amber{background:var(--warn)} .bar > i.red{background:var(--bad)}
.ring{--p:0;--sz:66px;--c:var(--brand);width:var(--sz);height:var(--sz);border-radius:50%;
  background:conic-gradient(var(--c) calc(var(--p)*1%),#eceef3 0);display:flex;align-items:center;justify-content:center;flex:none}
.ring > span{width:calc(var(--sz) - 13px);height:calc(var(--sz) - 13px);background:var(--surface);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:720;font-size:15px}

/* Score chip */
.score{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:46px;height:46px;border-radius:11px;font-weight:750;flex:none;line-height:1}
.score b{font-size:17px}
.score small{font-size:8px;font-weight:600;opacity:.8;letter-spacing:.04em;margin-top:2px}
.score.s-a{background:#eaf7ee;color:#15803d} .score.s-b{background:#eef1ff;color:#2a3fb8}
.score.s-c{background:#e6f6fa;color:#0e7490} .score.s-d{background:#f1f2f5;color:#6b7280}

/* Table-ish rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;align-items:center;gap:14px;padding:13px 16px;border-top:1px solid var(--line-2)}
.row:first-child{border-top:none}
.row:hover{background:var(--surface-2)}
.thead{padding:10px 16px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);border-bottom:1px solid var(--line)}
.clickable{cursor:pointer}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);padding:7px 12px;border-radius:9px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#d3d6de;color:var(--ink)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#3550f0}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:#eef0f4}
.btn.danger{color:var(--bad);border-color:#f3d3d3}
.btn.danger:hover{background:var(--bad-soft)}

/* Filter bar */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input[type=text]{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.filters select:focus,.filters input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.toggle input{display:none}
.toggle .sw{width:34px;height:20px;border-radius:20px;background:#d7dae2;position:relative;transition:.15s;flex:none}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle input:checked + .sw{background:var(--brand)}
.toggle input:checked + .sw::after{transform:translateX(14px)}

/* Chips (category filters) */
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:12.5px;font-weight:600}
.chip:hover{border-color:#cfd3db}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(20,22,28,.42);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;animation:fade .15s}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:760px;margin:auto;animation:pop .18s ease}
.modal.wide{max-width:920px}
@keyframes pop{from{opacity:0;transform:scale(.98) translateY(6px)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);border-radius:16px 16px 0 0;z-index:2}
.modal-head h3{font-size:16px}
.modal-body{padding:20px 22px}
.modal-foot{padding:15px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;position:sticky;bottom:0;background:var(--surface);border-radius:0 0 16px 16px}
.x{width:30px;height:30px;border-radius:8px;border:none;background:#eef0f4;color:var(--ink-2);font-size:16px;display:flex;align-items:center;justify-content:center}
.x:hover{background:#e2e5eb}

/* Forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.f{display:flex;flex-direction:column;gap:5px}
.f.full{grid-column:1 / -1}
.f label{font-size:12px;font-weight:650;color:var(--ink-2)}
.f label .req{color:var(--bad)}
.f input,.f select,.f textarea{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);width:100%}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.f textarea{resize:vertical;min-height:80px;line-height:1.55}
.f .hint{font-size:11px;color:var(--ink-3)}
.fieldset-title{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin:8px 0 2px;grid-column:1/-1;border-top:1px solid var(--line-2);padding-top:14px}
.fieldset-title:first-child{border-top:none;padding-top:0}

/* Checklist */
.checklist{display:flex;flex-direction:column;gap:2px}
.check{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;cursor:pointer}
.check:hover{background:var(--surface-2)}
.check .box{width:19px;height:19px;border-radius:6px;border:1.8px solid #cfd3db;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;transition:.12s}
.check.done .box{background:var(--good);border-color:var(--good)}
.check.done .txt{color:var(--ink-3);text-decoration:line-through}
.check .txt{font-size:13.5px;font-weight:500}

/* Funnel */
.funnel{display:flex;flex-direction:column;gap:7px}
.fstage{display:flex;align-items:center;gap:12px}
.fstage .fbar{height:38px;border-radius:9px;display:flex;align-items:center;padding:0 14px;color:#fff;font-weight:650;font-size:13px;min-width:120px;transition:width .5s;gap:8px;white-space:nowrap;overflow:hidden}
.fstage .fmeta{font-size:12px;color:var(--ink-3);white-space:nowrap}

/* Timeline */
.phase{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.phase + .phase{margin-top:14px}
.phase-head{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface-2);border-bottom:1px solid var(--line-2)}
.phase-head .ph-t{font-weight:700;font-size:14.5px}
.phase-head .ph-d{font-size:12px;color:var(--ink-3)}
.phase-body{padding:8px 18px 16px}
.phase.now{border-color:#c7d0ff;box-shadow:0 0 0 3px var(--brand-soft)}
.tl-item{display:flex;gap:10px;padding:7px 0;align-items:flex-start;font-size:13.5px;color:var(--ink-2)}
.tl-item .b{width:6px;height:6px;border-radius:50%;background:var(--brand);margin-top:7px;flex:none}

/* Verify badge */
.verify{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;padding:2px 8px;border-radius:6px}
.verify.v-ok{background:var(--good-soft);color:#15803d}
.verify.v-need{background:var(--warn-soft);color:#b45309}
.verify.v-old{background:var(--bad-soft);color:#b91c1c}
.sample-tag{font-size:10px;font-weight:750;letter-spacing:.05em;color:#8a6d1e;background:#fdf3d6;border:1px solid #f2e2ad;padding:1px 7px;border-radius:5px}

/* Empty */
.empty{text-align:center;padding:46px 20px;color:var(--ink-3)}
.empty .big{font-size:30px;margin-bottom:8px;opacity:.7}

/* misc */
.hr{height:1px;background:var(--line);border:none;margin:0}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wrapflex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.notice{background:var(--brand-soft);border:1px solid #d5dcff;color:var(--brand-ink);padding:11px 14px;border-radius:10px;font-size:12.5px;display:flex;gap:9px;align-items:flex-start}
.tag{font-size:11px;font-weight:600;color:var(--ink-2);background:#eef0f4;padding:2px 8px;border-radius:6px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:13px}
.kv dt{color:var(--ink-3);font-weight:550}
.kv dd{margin:0;color:var(--ink);font-weight:550}
.stat-inline{display:flex;gap:22px;flex-wrap:wrap}
.stat-inline .si .n{font-size:19px;font-weight:720}
.stat-inline .si .l{font-size:11.5px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.linkrow{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--surface)}
.linkrow:hover{border-color:#cfd3db}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:11px;font-weight:600;font-size:13px;box-shadow:var(--shadow-lg);z-index:200;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,-4px)}

@media(max-width:1080px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){.form-grid{grid-template-columns:1fr}.app{padding:0 16px 80px}.topbar-inner{padding:12px 16px}.gsearch{max-width:none}}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}.brand .sub{display:none}}
.two{grid-template-columns:1.6fr 1fr}
.three{grid-template-columns:repeat(3,1fr)}
@media(max-width:980px){.two,.three{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="mark">L</div>
      <div>
        <h1 id="brandTitle">London's College Command Center</h1>
        <div class="sub">College Planning OS · Class of 2028</div>
      </div>
    </div>
    <div class="topbar-spacer"></div>
    <div class="gsearch">
      <span class="ic">⌕</span>
      <input id="globalSearch" type="text" placeholder="Search scholarships, colleges, tasks…" autocomplete="off">
    </div>
    <button class="topbtn primary" onclick="go('find')">+ Add College</button>
  </div>
  <div class="topbar-inner" style="padding-top:0;padding-bottom:8px">
    <nav class="nav" id="nav"></nav>
  </div>
</div>
<div class="app">
  <div id="view"></div>
</div>
<div id="modalRoot"></div>
<div id="toast" class="toast"></div>
<script>
/* ============================================================
   SCHOLARSHIP COMMAND CENTER — single-file app (vanilla JS)
   Data persists in localStorage. No external dependencies.
============================================================ */
"use strict";
const LS_KEY = "london_scc_v1";
const TODAY = new Date(); TODAY.setHours(0,0,0,0);

/* ---------- Domain constants ---------- */
const STATUSES = [
  {k:"RESEARCHING",  label:"Researching",        cls:"gray",   stage:"IDENTIFIED"},
  {k:"QUALIFIED",    label:"Qualified",          cls:"info",   stage:"QUALIFIED"},
  {k:"APPLYING",     label:"Applying",           cls:"blue",   stage:"STARTED"},
  {k:"WAITING",      label:"Waiting on Materials",cls:"amber",  stage:"STARTED"},
  {k:"READY",        label:"Ready to Submit",    cls:"purple", stage:"STARTED"},
  {k:"SUBMITTED",    label:"Submitted",          cls:"blue",   stage:"SUBMITTED"},
  {k:"FINALIST",     label:"Finalist",           cls:"purple", stage:"FINALIST"},
  {k:"WON",          label:"Won",                cls:"green",  stage:"WON"},
  {k:"NOT_SELECTED", label:"Not Selected",       cls:"red",    stage:"CLOSED"},
  {k:"NOT_ELIGIBLE", label:"Not Eligible",       cls:"gray",   stage:"CLOSED"},
];
const statusMeta = k => STATUSES.find(s=>s.k===k) || STATUSES[0];

const FUNNEL_STAGES = ["IDENTIFIED","QUALIFIED","STARTED","SUBMITTED","FINALIST","WON"];
const FUNNEL_COLORS = {IDENTIFIED:"#8a919e",QUALIFIED:"#0891b2",STARTED:"#3d5afe",SUBMITTED:"#6b7cff",FINALIST:"#7c3aed",WON:"#16a34a"};

const PRIORITIES = [
  {k:"A", label:"Priority A", icon:"🔥", cls:"red",   desc:"$10,000+ potential value or exceptional renewable/full-tuition opportunity"},
  {k:"B", label:"Priority B", icon:"🟢", cls:"green", desc:"$2,500–$9,999"},
  {k:"C", label:"Priority C", icon:"🔵", cls:"info",  desc:"$500–$2,499 — especially local, niche, or manageable"},
  {k:"LOW",label:"Low / Lottery", icon:"⚪", cls:"gray", desc:"Mass-market sweepstakes & extremely competitive no-essay awards"},
];
const prioMeta = k => PRIORITIES.find(p=>p.k===k) || PRIORITIES[3];

const CATEGORIES = ["College Specific","National","Tennessee","Middle Tennessee","Rutherford County / Murfreesboro","Local","Academic Merit","Leadership","Community Service","Women","STEM","Health / Wellness","Healthcare","Exercise Science / Kinesiology","Business / Entrepreneurship","Employer","Professional Association","Community Organization","Essay Competition","Other"];

const COMPETITION = ["Low","Moderate","High","Very High"];
const EFFORT = ["Low","Medium","High"];
const VERIFY = {
  ok:{cls:"v-ok",dot:"🟢",label:"Verified"},
  need:{cls:"v-need",dot:"🟡",label:"Needs Verification"},
  old:{cls:"v-old",dot:"🔴",label:"May Be Outdated"},
};

/* Student profile drives the "fit" component of the Opportunity Score */
const DEFAULT_PROFILE = {
  name:"London",
  gradYear:2028,
  gpa:3.9,
  actComposite:27,
  satTotal:null,
  state:"TN",
  county:"Rutherford County",
  city:"Murfreesboro",
  majors:["Health / Wellness","Exercise Science / Kinesiology","Healthcare"],
  activities:"Varsity sports; health-sciences club; community volunteering",
  strengths:{academic:true, leadership:true, service:true, women:true},
};

/* ---------- School-preference model (onboarding quiz) ---------- */
const PREF_FACTORS=[
  {k:"academics",  icon:"📚", label:"Strong academics in my major", group:"Academics & Career"},
  {k:"career",     icon:"💼", label:"Career outcomes & internships", group:"Academics & Career"},
  {k:"research",   icon:"🔬", label:"Research opportunities", group:"Academics & Career"},
  {k:"honors",     icon:"🎓", label:"Honors program / academic rigor", group:"Academics & Career"},
  {k:"athletics",  icon:"🏟️", label:"Sports & school spirit", group:"Vibe & Community"},
  {k:"campuslife", icon:"🎉", label:"Campus life & social scene", group:"Vibe & Community"},
  {k:"greek",      icon:"🏛️", label:"Greek life (sororities/fraternities)", group:"Vibe & Community"},
  {k:"diversity",  icon:"🌍", label:"Diversity & inclusion", group:"Vibe & Community"},

function daysBadge(d){

}

/* ---------- OPPORTUNITY SCORE (0–100) ----------
   Deliberately favors strong-fit, winnable, local, renewable money over
   raw award size. A $2,500 local award with great fit beats a $10k national
   sweepstakes. Weighted sub-scores, each 0–1, summed to 100.            */
function opportunityScore(s){
  const p = STATE.profile;
  const amt = Number(s.awardAmount)||0;
  const fourYr = fourYearValue(s);

  // Value (max 22) — log-scaled on 4-year value so mega awards don't dominate
  const valScore = Math.min(1, Math.log10(Math.max(fourYr,1)+1)/Math.log10(60001)) ;
  const W_val = 22*valScore;

  // Renewable (max 8)
  const W_ren = s.renewable ? 8 : 2;

  // Applicant fit (max 20) — major/interest, location, academic/leadership/service alignment
  let fit=0, fitMax=0;
  const cats=(s.categories||[]);
  const majorHit = cats.some(c=>["Health / Wellness","Healthcare","Exercise Science / Kinesiology","STEM"].includes(c)) &&
                   p.majors.some(m=>cats.includes(m)||["Health / Wellness","Healthcare","Exercise Science / Kinesiology"].includes(m));
  fitMax+=6; if(majorHit) fit+=6; else if(!s.majorReq) fit+=3;
  fitMax+=4; if(s.womenOnly && p.strengths.women) fit+=4; else if(!s.womenOnly) fit+=2;
  fitMax+=4; if(s.leadershipReq){ fit+= p.strengths.leadership?4:1;} else fit+=2;
  fitMax+=4; if(s.serviceReq){ fit+= p.strengths.service?4:1;} else fit+=2;
  fitMax+=2; if(cats.includes("Academic Merit")){ fit+= p.strengths.academic?2:0.5;} else fit+=1;
  const W_fit = 20*(fit/fitMax);

  // Probability of qualification (max 12) — do we meet GPA / test gates?
  let prob=1;
  if(s.minGPA && p.gpa < Number(s.minGPA)) prob-=0.55;
  if(s.actReq && p.actComposite && p.actComposite < Number(s.actReq)) prob-=0.35;
  if(s.residencyReq && s.residencyReq!=="None" && !matchesResidency(s.residencyReq,p)) prob-=0.6;
  prob=Math.max(0,prob);
  const W_prob = 12*prob;

  // Competition & applicant pool (max 16) — local & low-competition rewarded
  const compIdx = {Low:1,Moderate:0.72,High:0.42,"Very High":0.18}[s.competition] ?? 0.5;
  const localBonus = cats.some(c=>["Local","Rutherford County / Murfreesboro","Middle Tennessee","Tennessee","College Specific","Employer","Community Organization"].includes(c)) ? 1 : 0.55;
  const W_comp = 16*(0.55*compIdx + 0.45*localBonus);

  // Effort efficiency (max 10) — lower effort & no/short essay = higher
  const effIdx = {Low:1,Medium:0.65,High:0.32}[s.effort] ?? 0.6;
  const essayPenalty = !s.essayReq ? 1 : (Number(s.essayWords)>500?0.55:0.78);
  const W_eff = 10*(0.6*effIdx + 0.4*essayPenalty);

  // Deadline urgency (max 8) — a bit of urgency weighting, but not overwhelming
  const d = daysUntil(s.deadline);
  let urg=0.5;
  if(d!==null){ if(d<0) urg=0.05; else if(d<=14) urg=1; else if(d<=45) urg=0.85; else if(d<=120) urg=0.6; else urg=0.4; }
  const W_urg = 8*urg;

  // Academic fit small bump (max 4)
  const W_acad = 4*(cats.includes("Academic Merit")? (p.strengths.academic?1:0.5):0.5);

  let total = W_val+W_ren+W_fit+W_prob+W_comp+W_eff+W_urg+W_acad;
  // Hard dampeners
  if(s.status==="NOT_ELIGIBLE") total*=0.35;
  if(cats.includes("Essay Competition") && s.competition==="Very High") total*=0.9;
  return Math.max(0, Math.min(100, Math.round(total)));
}
function matchesResidency(req,p){
  req=(req||"").toLowerCase();
  if(req.includes("rutherford")||req.includes("murfreesboro")) return /rutherford/i.test(p.county)||/murfreesboro/i.test(p.city);
  if(req.includes("tennessee")||req==="tn") return p.state==="TN";
  return true;
}
function scoreClass(sc){ if(sc>=75) return "s-a"; if(sc>=55) return "s-b"; if(sc>=38) return "s-c"; return "s-d"; }
function scoreLabel(sc){ if(sc>=75) return "STRONG"; if(sc>=55) return "GOOD"; if(sc>=38) return "FAIR"; return "LOW"; }

/* Does the student currently qualify (for the "only show qualifying" toggle)? */
function qualifies(s){
  const p=STATE.profile;
  if(s.minGPA && p.gpa < Number(s.minGPA)) return false;
  if(s.actReq && p.actComposite && p.actComposite < Number(s.actReq)) return false;
  if(s.residencyReq && s.residencyReq!=="None" && !matchesResidency(s.residencyReq,p)) return false;
  if(s.status==="NOT_ELIGIBLE") return false;
  return true;
}

/* ============================================================
   METRICS
============================================================ */
const CLOSED=["NOT_SELECTED","NOT_ELIGIBLE"];
const SUBMITTED_PLUS=["SUBMITTED","FINALIST","WON","NOT_SELECTED"];
function isActive(s){ return !CLOSED.includes(s.status) && s.status!=="WON"; }
function metrics(){
  const S=STATE.scholarships;
  const identified=S.filter(s=>!CLOSED.includes(s.status)).length;
  const submitted=S.filter(s=>SUBMITTED_PLUS.includes(s.status)||s.dateSubmitted).length;
  const potential=S.filter(isActive).reduce((a,s)=>a+fourYearValue(s),0);
  const wonList=S.filter(s=>s.status==="WON");
  const won=wonList.length;
  const dollarsWon=wonList.reduce((a,s)=>a+(Number(s.awardReceived)||Number(s.awardAmount)||0),0);
  const dueSoon=S.filter(s=>{ const d=daysUntil(s.deadline); return d!==null&&d>=0&&d<=30 && !["SUBMITTED","WON","NOT_SELECTED","NOT_ELIGIBLE"].includes(s.status); }).length;
  const renewableAnnual=wonList.filter(s=>s.renewable).reduce((a,s)=>a+(Number(s.awardAmount)||0),0);
  const fourYearWon=wonList.reduce((a,s)=>a+fourYearValue(s),0);
  // Overall progress: half application advancement, half master-task completion
  const appProg = identified? Math.round(S.filter(s=>SUBMITTED_PLUS.includes(s.status)).length / identified*100):0;
  const taskProg = STATE.tasks.length? Math.round(STATE.tasks.filter(t=>t.status==="done").length/STATE.tasks.length*100):0;
  const overall=Math.round(appProg*0.5+taskProg*0.5);
  return {identified,submitted,potential,won,dollarsWon,dueSoon,renewableAnnual,fourYearWon,appProg,taskProg,overall};
}
function funnelData(){
  const counts={},dollars={};
  FUNNEL_STAGES.forEach(st=>{counts[st]=0;dollars[st]=0;});
  const order=FUNNEL_STAGES;
  STATE.scholarships.forEach(s=>{
    if(CLOSED.includes(s.status)) return;
    const stage=statusMeta(s.status).stage;
    const idx=order.indexOf(stage); if(idx<0) return;
    // cumulative funnel: a WON scholarship also counts as identified/qualified/started/submitted/finalist
    for(let i=0;i<=idx;i++){ counts[order[i]]++; dollars[order[i]]+=fourYearValue(s); }
  });
  const wonDollars=STATE.scholarships.filter(s=>s.status==="WON").reduce((a,s)=>a+(Number(s.awardReceived)||Number(s.awardAmount)||0),0);
  return {counts,dollars,wonDollars};
}

function weeklyActions(){
  const out=[]; const S=STATE.scholarships;
  const overdue=S.filter(s=>{const d=daysUntil(s.deadline);return d!==null&&d<0&&!["SUBMITTED","WON","NOT_SELECTED","NOT_ELIGIBLE"].includes(s.status);});

  const soon=S.filter(s=>{const d=daysUntil(s.deadline);return d!==null&&d>=0&&d<=7&&!["SUBMITTED","WON","NOT_SELECTED","NOT_ELIGIBLE"].includes(s.status);}).sort((a,b)=>daysUntil(a.deadline)-daysUntil(b.deadline));
  if(soon.length) out.push({icon:"⏰",text:`Apply to "${soon[0].name.replace(/^SAMPLE — /,'')}" — due in ${daysUntil(soon[0].deadline)} day${daysUntil(soon[0].deadline)===1?"":"s"}`,sub:"Highest-urgency open deadline",go:`openScholarshipDetail('${soon[0].id}')`});
  const ready=S.filter(s=>s.status==="READY");
  if(ready.length) out.push({icon:"✅",text:`Submit "${ready[0].name.replace(/^SAMPLE — /,'')}" — it's marked Ready to Submit`,go:`openScholarshipDetail('${ready[0].id}')`});
  const essayTask=STATE.tasks.find(t=>t.cat==="Essays"&&t.status!=="done");
  if(essayTask) out.push({icon:"✍️",text:essayTask.subject,sub:"Build your reusable essay library once, then customize",go:"go('essays')"});
  const topOpen=[...S].filter(s=>s.status==="RESEARCHING"||s.status==="QUALIFIED").sort((a,b)=>opportunityScore(b)-opportunityScore(a))[0];
  if(topOpen) out.push({icon:"🎯",text:`Start your highest-score opportunity: "${topOpen.name.replace(/^SAMPLE — /,'')}"`,sub:`Opportunity Score ${opportunityScore(topOpen)}/100`,go:`openScholarshipDetail('${topOpen.id}')`});
  out.push({icon:"🔎",text:"Research 5 new local / regional scholarships",sub:"Local before lottery — best applicant-to-award odds",go:"go('resources')"});
  return out.slice(0,5);
}

/* ============================================================
   SCHOLARSHIPS — CRM pipeline, list, filters, search
============================================================ */
function filteredScholarships(){
  const f=VIEWSTATE.schFilters; const q=(VIEWSTATE.search||"").trim().toLowerCase();
  let list=STATE.scholarships.filter(s=>{
    if(q){ const hay=(s.name+" "+s.org+" "+(s.categories||[]).join(" ")+" "+(s.notes||"")).toLowerCase(); if(!hay.includes(q)) return false; }
    if(f.cat!=="All" && !(s.categories||[]).includes(f.cat)) return false;
    if(f.status!=="All" && s.status!==f.status) return false;
    if(f.priority!=="All" && s.priority!==f.priority) return false;
    if(f.essay==="Yes" && !s.essayReq) return false;
    if(f.essay==="No" && s.essayReq) return false;
    if(f.competition!=="All" && s.competition!==f.competition) return false;
    if(f.effort!=="All" && s.effort!==f.effort) return false;
    if(f.qualifyOnly && !qualifies(s)) return false;
    return true;
  });
  const sort=f.sort;
  list.sort((a,b)=>{
    if(sort==="score") return opportunityScore(b)-opportunityScore(a);
    if(sort==="deadline"){ const da=daysUntil(a.deadline),db=daysUntil(b.deadline); return (da===null?9e9:da)-(db===null?9e9:db); }
    if(sort==="value") return fourYearValue(b)-fourYearValue(a);
    if(sort==="priority"){ const o={A:0,B:1,C:2,LOW:3}; return o[a.priority]-o[b.priority]; }
    if(sort==="name") return a.name.localeCompare(b.name);
    return 0;
  });
  return list;
}

      <select onchange="setF('competition',this.value)"><option value="All">Any competition</option>${COMPETITION.map(c=>`<option ${f.competition===c?"selected":""}>${c}</option>`).join("")}</select>
      <select onchange="setF('effort',this.value)"><option value="All">Any effort</option>${EFFORT.map(c=>`<option ${f.effort===c?"selected":""}>${c}</option>`).join("")}</select>

      <select onchange="setF('sort',this.value)">${sel(f.sort,f.sort,[{v:"score",l:"Sort: Opportunity Score"},{v:"deadline",l:"Sort: Deadline"},{v:"value",l:"Sort: 4-yr Value"},{v:"priority",l:"Sort: Priority"},{v:"name",l:"Sort: Name"}])}</select>
      <button class="btn ${layout==='list'?'primary':''} sm" onclick="setF('layout','list')">List</button>
      <button class="btn ${layout==='board'?'primary':''} sm" onclick="setF('layout','board')">Pipeline</button>

  let body;
  if(layout==="board"){

  }else{
    body=`<div class="card">
      <div class="thead row" style="grid-template-columns:56px 1fr 130px 120px 110px 120px 44px">
        <div>Score</div><div>Scholarship</div><div>Priority</div><div>4-yr Value</div><div>Deadline</div><div>Status</div><div></div>
      </div>
      <div class="rows">
        ${list.map(s=>scholarshipRow(s)).join("")||`<div class="empty"><div class="big">🔍</div>No scholarships match your filters.<div style="margin-top:12px"><button class="btn primary" onclick="openScholarshipModal()">+ Add a scholarship</button></div></div>`}
      </div>
    </div>`;
  }

  return `<div class="page-head">
    <div><div class="t">Scholarship Pipeline</div><div class="d">${list.length} of ${STATE.scholarships.length} shown · sorted by ${({score:"Opportunity Score",deadline:"deadline",value:"4-yr value",priority:"priority",name:"name"})[f.sort]}</div></div>
    <div class="wrapflex"><button class="btn" onclick="exportMenu()">⇩ Export</button><button class="btn" onclick="openImport()">⇧ Import</button><button class="btn primary" onclick="openScholarshipModal()">+ Scholarship</button></div>
  </div>

  ${filterBar}${body}`;
};

  return `<div style="display:flex;gap:12px;overflow-x:auto;padding-bottom:10px">
    ${cols.map(st=>{

        <div class="spread" style="margin-bottom:8px;padding:0 2px"><span class="pill ${st.cls}"><span class="dot"></span>${st.label}</span><span class="muted mono" style="font-size:11.5px">${items.length}</span></div>
        <div class="muted mono" style="font-size:11px;margin:0 2px 8px">${fmtMoneyShort(val)} potential</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${items.map(s=>`<div class="card pad clickable" style="padding:11px;box-shadow:none" onclick="openScholarshipDetail('${s.id}')">
            <div style="display:flex;gap:8px;align-items:flex-start;justify-content:space-between">
              <div style="font-weight:620;font-size:12.5px;line-height:1.35">${esc(s.name.replace(/^SAMPLE — /,''))}</div>
              <div class="score ${scoreClass(opportunityScore(s))}" style="width:34px;height:34px;border-radius:8px"><b style="font-size:13px">${opportunityScore(s)}</b></div>
            </div>
            <div class="muted" style="font-size:11px;margin:6px 0 8px">${fmtMoney(fourYearValue(s))} · ${prioMeta(s.priority).icon}</div>

function getSch(id){ return STATE.scholarships.find(s=>s.id===id); }

  const q=qualifies(s);

    <div class="modal-head">
      <div style="display:flex;gap:13px;align-items:center;min-width:0">
        ${scoreChip(s)}
        <div style="min-width:0"><h3 style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.name)}</h3>
        <div class="muted" style="font-size:12.5px">${esc(s.org||"—")} · ${(s.categories||[]).join(" · ")||"Uncategorized"}</div></div>
      </div>

    <div class="modal-body">
      <div class="wrapflex" style="margin-bottom:14px">

      </div>

        <div class="card pad" style="box-shadow:none"><div class="l muted" style="font-size:11px;font-weight:600;text-transform:uppercase">Award</div><div class="mono" style="font-size:19px;font-weight:720;margin-top:4px">${s.fullTuition?"Full tuition*":fmtMoney(s.awardAmount)}</div><div class="muted" style="font-size:12px">${s.renewable?`Renewable · ${fmtMoney(fourYearValue(s))} over ${s.renewYears||4} yrs`:"One-time"}</div></div>
        <div class="card pad" style="box-shadow:none"><div class="l muted" style="font-size:11px;font-weight:600;text-transform:uppercase">Deadline</div><div style="font-size:16px;font-weight:700;margin-top:4px">${s.deadline?fmtDate(s.deadline):'<span style="color:var(--warn)">VERIFY CURRENT CYCLE</span>'}</div><div style="margin-top:4px">${daysBadge(daysUntil(s.deadline))}</div></div>
        <div class="card pad" style="box-shadow:none"><div class="l muted" style="font-size:11px;font-weight:600;text-transform:uppercase">Opportunity Score</div><div class="mono" style="font-size:19px;font-weight:720;margin-top:4px">${sc}<span class="muted" style="font-size:12px">/100 · ${scoreLabel(sc)}</span></div><div class="muted" style="font-size:11px;margin-top:2px">Competition: ${s.competition} · Effort: ${s.effort}</div></div>

      <div class="grid two">

        <button class="btn danger sm" onclick="deleteScholarship('${s.id}')">Delete</button>
        <button class="btn primary sm" onclick="openScholarshipModal('${s.id}')">Edit details</button>

  openModal(body, true);
}

function toggleCheck(id,item){
  const s=getSch(id); if(!s) return; s.checklist=s.checklist||{}; s.checklist[item]=!s.checklist[item];
  // auto-advance status hints
  if(item==="Submitted" && s.checklist[item] && !["SUBMITTED","FINALIST","WON","NOT_SELECTED"].includes(s.status)){ s.status="SUBMITTED"; if(!s.dateSubmitted) s.dateSubmitted=isoToday(); }
  saveState(); openScholarshipDetail(id);
}
function changeStatus(id,val){
  const s=getSch(id); if(!s) return; s.status=val;
  if(val==="SUBMITTED"&&!s.dateSubmitted) s.dateSubmitted=isoToday();
  if(val==="WON"&&!s.awardReceived) { saveState(); openRecordAward(id); return; }
  saveState(); openScholarshipDetail(id); toast("Status updated");
}
function deleteScholarship(id){
  const s=getSch(id); if(!s) return;
  if(!confirm(`Delete "${s.name}"? This cannot be undone.`)) return;
  STATE.scholarships=STATE.scholarships.filter(x=>x.id!==id); saveState(); closeModal(); render(); toast("Scholarship deleted");
}

function openRecordAward(id){
  const s=getSch(id); if(!s) return;
  const body=`<div class="modal-head"><h3>🏆 Record Scholarship Award</h3><button class="x" onclick="closeModal()">✕</button></div>
  <div class="modal-body">
    <div class="muted" style="margin-bottom:14px">Recording an award marks this scholarship as <b>Won</b> and adds it to Dollars Won and your Financial Impact.</div>
    <div class="form-grid">
      <div class="f"><label>Award amount received</label><input id="aw_amt" type="number" value="${s.awardReceived||s.awardAmount||""}" placeholder="e.g. 2000"></div>
      <div class="f"><label>Renewable?</label><select id="aw_ren"><option value="no" ${!s.renewable?"selected":""}>No — one-time</option><option value="yes" ${s.renewable?"selected":""}>Yes — annual</option></select></div>
      <div class="f"><label>Renewable years</label><input id="aw_yrs" type="number" value="${s.renewYears||4}"></div>
      <div class="f"><label>Result note</label><input id="aw_res" type="text" value="${esc(s.result||"Awarded")}"></div>
    </div>
  </div>
  <div class="modal-foot"><span></span><div class="wrapflex"><button class="btn" onclick="openScholarshipDetail('${id}')">Cancel</button><button class="btn primary" onclick="saveAward('${id}')">Save award</button></div></div>`;
  openModal(body);
}
function saveAward(id){
  const s=getSch(id); if(!s) return;
  s.awardReceived=Number(document.getElementById("aw_amt").value)||0;
  s.renewable=document.getElementById("aw_ren").value==="yes";
  s.renewYears=Number(document.getElementById("aw_yrs").value)||4;
  s.result=document.getElementById("aw_res").value;
  s.status="WON"; s.checklist=s.checklist||{}; s.checklist["Confirmation received"]=true;
  saveState(); closeModal(); render(); toast("Award recorded 🎉");
}

function suggestPriority(fourYr,renewable){
  if(fourYr>=10000||renewable&&fourYr>=8000) return "A";
  if(fourYr>=2500) return "B";
  if(fourYr>=500) return "C";
  return "LOW";
}
function saveScholarship(id){
  const g=id=>document.getElementById(id);
  const name=g("sf_name").value.trim();
  if(!name){ toast("Name is required"); g("sf_name").focus(); return; }
  const cats=[...document.querySelectorAll("#sf_cats input:checked")].map(i=>i.value);
  const renewable=g("sf_ren").value==="yes";
  const obj={
    name, org:g("sf_org").value.trim(), url:g("sf_url").value.trim(), categories:cats,
    awardAmount:Number(g("sf_amt").value)||0, renewable, renewYears:Number(g("sf_yrs").value)||4, fullTuition:g("sf_full").value==="yes",

function semesterEndDays(){
  const m=TODAY.getMonth(); const y=TODAY.getFullYear();
  let end; if(m<=4) end=new Date(y,4,31); else if(m<=6) end=new Date(y,7,15); else end=new Date(y,11,31);
  return Math.round((end-TODAY)/86400000);
}
VIEWS.deadlines=function(){
  const semEnd=semesterEndDays();
  const buckets={OVERDUE:[],"NEXT 7 DAYS":[],"NEXT 30 DAYS":[],"NEXT 60 DAYS":[],"THIS SEMESTER":[],LATER:[]};
  STATE.scholarships.forEach(s=>{
    if(["WON","NOT_SELECTED","NOT_ELIGIBLE"].includes(s.status)) return;
    const d=daysUntil(s.deadline); if(d===null) return;
    if(d<0) buckets.OVERDUE.push(s);
    else if(d<=7) buckets["NEXT 7 DAYS"].push(s);
    else if(d<=30) buckets["NEXT 30 DAYS"].push(s);
    else if(d<=60) buckets["NEXT 60 DAYS"].push(s);
    else if(d<=Math.max(semEnd,61)) buckets["THIS SEMESTER"].push(s);
    else buckets.LATER.push(s);
  });
  Object.values(buckets).forEach(arr=>arr.sort((a,b)=>daysUntil(a.deadline)-daysUntil(b.deadline)));
  const noDate=STATE.scholarships.filter(s=>!s.deadline&&!["WON","NOT_SELECTED","NOT_ELIGIBLE"].includes(s.status));
  const meta={OVERDUE:{cls:"red",ic:"🚨"},"NEXT 7 DAYS":{cls:"red",ic:"🔥"},"NEXT 30 DAYS":{cls:"amber",ic:"⏰"},"NEXT 60 DAYS":{cls:"info",ic:"📅"},"THIS SEMESTER":{cls:"blue",ic:"🗓️"},LATER:{cls:"gray",ic:"🌙"}};
  const section=(title)=>{
    const arr=buckets[title]; const m=meta[title];
    return `<div class="card" style="margin-bottom:16px">
      <div class="spread pad" style="padding-bottom:12px"><div class="wrapflex"><span style="font-size:16px">${m.ic}</span><h3 style="font-size:15px">${title}</h3><span class="pill ${m.cls}">${arr.length}</span></div>
        <span class="muted mono" style="font-size:12px">${fmtMoneyShort(arr.reduce((a,s)=>a+fourYearValue(s),0))} potential</span></div>
      <div class="rows">
        ${arr.map(s=>`<div class="row clickable" style="grid-template-columns:auto 1fr 130px 120px 110px" onclick="openScholarshipDetail('${s.id}')">
          ${scoreChip(s)}
          <div style="min-width:0"><div style="font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.name)} ${sampleTag(s)}</div><div class="muted" style="font-size:12px">${esc(s.org||"")} · ${fmtDate(s.deadline)}</div></div>
          <div>${prioPill(s.priority)}</div>
          <div class="mono" style="font-weight:600">${fmtMoney(fourYearValue(s))}</div>
          <div>${daysBadge(daysUntil(s.deadline))}</div>
        </div>`).join("")||`<div class="empty" style="padding:22px">Nothing here.</div>`}
      </div>
    </div>`;
  };
  return `<div class="page-head"><div><div class="t">Deadline Center</div><div class="d">All open application deadlines, sorted by urgency. Deadlines are non-negotiable.</div></div>
    <button class="btn primary" onclick="openScholarshipModal()">+ Scholarship</button></div>
  ${buckets.OVERDUE.length?`<div class="notice" style="background:var(--bad-soft);border-color:#f3caca;color:#b91c1c;margin-bottom:16px">🚨 You have ${buckets.OVERDUE.length} overdue item(s). Update their status or confirm whether the deadline moved.</div>`:""}
  ${["OVERDUE","NEXT 7 DAYS","NEXT 30 DAYS","NEXT 60 DAYS","THIS SEMESTER","LATER"].map(section).join("")}
  ${noDate.length?`<div class="card pad"><div class="section-title">⚠ No deadline set / VERIFY CURRENT CYCLE (${noDate.length})</div>${noDate.map(s=>`<div class="linkrow"><span>${esc(s.name)} ${sampleTag(s)}</span><button class="btn sm" onclick="openScholarshipModal('${s.id}')">Add deadline</button></div>`).join("")}</div>`:""}`;
};

const VERSION_LENGTHS=["100","250","400","500","650"];
function wc(str){ return (str||"").trim().split(/\s+/).filter(Boolean).length; }
VIEWS.essays=function(){
  return `<div class="page-head"><div><div class="t">Essay Vault</div><div class="d">Reusable essays so each application becomes: select → customize → proofread → submit.</div></div>

        <div class="muted" style="font-size:12px;margin-bottom:10px">${words} / ${e.target||"—"} words · updated ${fmtDate(e.updated)}</div>
        <div class="bar thin" style="margin-bottom:10px"><i style="width:${pct}%"></i></div>
        <div class="wrapflex">${["100","250","400","500","650"].map(v=>`<span class="tag" style="${vers.includes(v)?'background:var(--good-soft);color:#15803d':''}">${v}w${vers.includes(v)?" ✓":""}</span>`).join("")}</div>
        ${(e.usedFor||[]).length?`<div class="muted" style="font-size:11.5px;margin-top:10px">Used for: ${e.usedFor.map(esc).join(", ")}</div>`:""}
      </div>`;}).join("")||`<div class="empty">No essays yet.</div>`}
  </div>`;
};
function openEssayDetail(id){
  const e=STATE.essays.find(x=>x.id===id); if(!e) return; const words=wc(e.body);
  const vers=VERSION_LENGTHS.filter(k=>(e.versions||{})[k]&&e.versions[k].trim());
  const body=`<div class="modal-head"><div><h3>${esc(e.title)}</h3><div class="muted" style="font-size:12.5px">${esc(e.theme)} · ${words} words ${sampleTag(e)}</div></div><button class="x" onclick="closeModal()">✕</button></div>
  <div class="modal-body">
    <div class="section-title">Full essay <span class="muted" style="text-transform:none;font-weight:500">(target ${e.target||"—"} words)</span></div>
    <div class="card pad" style="box-shadow:none;background:var(--surface-2);white-space:pre-wrap;font-size:13.5px;line-height:1.65">${esc(e.body||"—")}</div>
    ${vers.length?`<div class="section-title" style="margin-top:18px">Length versions</div>${vers.map(v=>`<div class="card pad" style="box-shadow:none;margin-bottom:8px"><div class="spread" style="margin-bottom:6px"><span class="tag">${v}-word version · ${wc(e.versions[v])} words</span></div><div style="white-space:pre-wrap;font-size:13px;line-height:1.6">${esc(e.versions[v])}</div></div>`).join("")}`:`<div class="muted" style="font-size:12.5px;margin-top:14px">No length versions saved yet — add 100 / 250 / 400 / 500 / 650-word cuts in the editor.</div>`}
    ${(e.usedFor||[]).length?`<div class="section-title" style="margin-top:18px">Scholarships used for</div><div class="wrapflex">${e.usedFor.map(u=>`<span class="tag">${esc(u)}</span>`).join("")}</div>`:""}
  </div>
  <div class="modal-foot"><button class="btn danger sm" onclick="deleteEssay('${e.id}')">Delete</button><div class="wrapflex"><button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="openEssayModal('${e.id}')">Edit</button></div></div>`;
  openModal(body, true);
}
function openEssayModal(id){
  const e=id?STATE.essays.find(x=>x.id===id):null; const isNew=!e; const d=e||{theme:"Personal Story / Challenge",target:500,versions:{},usedFor:[]};
  const body=`<div class="modal-head"><h3>${isNew?"Add Essay":"Edit Essay"}</h3><button class="x" onclick="closeModal()">✕</button></div>
  <div class="modal-body"><div class="form-grid">
    <div class="f"><label>Title <span class="req">*</span></label><input id="ef_title" type="text" value="${esc(d.title||"")}"></div>
    <div class="f"><label>Theme</label><select id="ef_theme">${ESSAY_THEMES.map(t=>`<option ${d.theme===t?"selected":""}>${t}</option>`).join("")}</select></div>
    <div class="f"><label>Target word count</label><input id="ef_target" type="number" value="${d.target||500}"></div>
    <div class="f"><label>Scholarships used for (comma-separated)</label><input id="ef_used" type="text" value="${esc((d.usedFor||[]).join(", "))}"></div>
    <div class="f full"><label>Full essay <span id="ef_wc" class="muted" style="font-weight:500"></span></label><textarea id="ef_body" style="min-height:180px" oninput="document.getElementById('ef_wc').textContent='· '+(this.value.trim().split(/\\s+/).filter(Boolean).length)+' words'">${esc(d.body||"")}</textarea></div>
    <div class="fieldset-title">Length versions (optional)</div>
    ${VERSION_LENGTHS.map(v=>`<div class="f full"><label>${v}-word version</label><textarea id="ef_v${v}" style="min-height:60px">${esc((d.versions||{})[v]||"")}</textarea></div>`).join("")}

  <div class="modal-foot"><span></span><div class="wrapflex"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveEssay(${id?`'${id}'`:"null"})">${isNew?"Add":"Save"}</button></div></div>`;
  openModal(body, true);
  setTimeout(()=>{const t=document.getElementById("ef_body");if(t)document.getElementById("ef_wc").textContent="· "+wc(t.value)+" words";},0);
}
function saveEssay(id){ const g=x=>document.getElementById(x); const title=g("ef_title").value.trim(); if(!title){toast("Title required");return;}
  const versions={}; VERSION_LENGTHS.forEach(v=>{const val=g("ef_v"+v).value.trim(); if(val) versions[v]=val;});
  const obj={title,theme:g("ef_theme").value,target:Number(g("ef_target").value)||500,body:g("ef_body").value,versions,
    usedFor:g("ef_used").value.split(",").map(s=>s.trim()).filter(Boolean),updated:isoToday()};
  if(id) Object.assign(STATE.essays.find(x=>x.id===id),obj); else STATE.essays.push(Object.assign({id:uid("essay"),sample:false},obj));
  saveState(); closeModal(); render(); toast(id?"Essay saved":"Essay added"); }
function deleteEssay(id){ const e=STATE.essays.find(x=>x.id===id); if(!confirm(`Delete "${e.title}"?`))return; STATE.essays=STATE.essays.filter(x=>x.id!==id); saveState(); closeModal(); render(); toast("Essay deleted"); }

============================================================ */
VIEWS.act=function(){
  const scores=[...STATE.actScores].sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const st=STATE.settings;
  const superscore=(()=>{ if(!scores.length) return null; const best={english:0,math:0,reading:0,science:0};
    scores.forEach(s=>{["english","math","reading","science"].forEach(k=>{ if(s[k]) best[k]=Math.max(best[k],s[k]); });});
    const secs=["english","math","reading","science"].map(k=>best[k]).filter(Boolean);
    return {sections:best, composite:Math.round(secs.reduce((a,b)=>a+b,0)/secs.length)}; })();
  const latest=scores[scores.length-1];
  const target=st.actTargetPrimary;
  const sectionBar=(label,val,max=36)=>{const pct=Math.round(val/max*100);const cls=val>=30?"good":val>=24?"":"red";return `<div style="margin-bottom:10px"><div class="spread" style="margin-bottom:4px"><span style="font-size:12.5px;font-weight:600">${label}</span><b class="mono">${val||"—"}</b></div><div class="bar thin"><i class="${cls}" style="width:${pct}%"></i></div></div>`;};
  const compChart=`<div style="display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:10px">
    ${scores.map(s=>{const h=Math.round(s.composite/36*100);return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%">
      <b class="mono" style="font-size:12px">${s.composite}</b><div style="width:100%;max-width:46px;height:${h}%;background:linear-gradient(180deg,#6b7cff,#3d5afe);border-radius:7px 7px 0 0;min-height:6px"></div>
      <span class="muted" style="font-size:10.5px">${fmtDate(s.date).replace(/, \d+$/,"")}</span></div>`;}).join("")}
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%;opacity:.6">
      <b class="mono" style="font-size:12px;color:var(--good)">${target}</b><div style="width:100%;max-width:46px;height:${Math.round(target/36*100)}%;background:repeating-linear-gradient(45deg,#e9f7ef,#e9f7ef 6px,#d6efe0 6px,#d6efe0 12px);border:1.5px dashed var(--good);border-radius:7px 7px 0 0"></div><span class="muted" style="font-size:10.5px">Target</span></div>
  </div>`;
  return `<div class="page-head"><div><div class="t">ACT Tracker</div><div class="d">Primary goal ${st.actTargetPrimary}+ composite · next ${st.actTargetNext} · stretch ${st.actTargetStretch}+.</div></div>
    <button class="btn primary" onclick="openActModal()">+ Test attempt</button></div>
  <div class="notice" style="margin-bottom:16px">📈 At schools that <b>consider ACT scores</b> for merit, raising your composite can raise merit-scholarship eligibility. Not every university uses ACT scores for merit — always confirm each school's specific policy.</div>
  <div class="grid two">
    <div class="card pad">
      <div class="spread" style="margin-bottom:14px"><div class="section-title" style="margin:0">Composite Progress</div><div class="wrapflex"><span class="pill blue">Latest ${latest?latest.composite:"—"}</span><span class="pill green">Superscore ${superscore?superscore.composite:"—"}</span></div></div>
      ${scores.length?compChart:`<div class="empty">Add your first attempt.</div>`}
      <div class="stat-inline" style="margin-top:16px;border-top:1px solid var(--line-2);padding-top:14px">
        <div class="si"><div class="n mono">${latest?latest.composite:"—"}</div><div class="l">Current composite</div></div>
        <div class="si"><div class="n mono" style="color:var(--good)">${superscore?superscore.composite:"—"}</div><div class="l">Superscore</div></div>
        <div class="si"><div class="n mono">${st.actTargetPrimary}</div><div class="l">Primary target</div></div>
        <div class="si"><div class="n mono">${latest?(st.actTargetPrimary-latest.composite>0?"+"+(st.actTargetPrimary-latest.composite):"✓"):"—"}</div><div class="l">To primary goal</div></div>
      </div>
    </div>
    <div class="card pad">
      <div class="section-title">Best section scores (superscore)</div>
      ${superscore?["English","Math","Reading","Science"].map(k=>sectionBar(k,superscore.sections[k.toLowerCase()])).join(""):`<div class="empty">No data.</div>`}
      <div class="muted" style="font-size:12px;margin-top:6px">Math is the clearest lever here — a focused Math push raises both the composite and the superscore.</div>
    </div>
  </div>
  <div class="card" style="margin-top:16px">
    <div class="thead row" style="grid-template-columns:130px 1fr 1fr 1fr 1fr 90px 60px"><div>Date</div><div>English</div><div>Math</div><div>Reading</div><div>Science</div><div>Composite</div><div></div></div>
    <div class="rows">
    ${scores.slice().reverse().map(s=>`<div class="row" style="grid-template-columns:130px 1fr 1fr 1fr 1fr 90px 60px">
      <div style="font-weight:600">${fmtDate(s.date)} ${sampleTag(s)}</div>
      <div class="mono">${s.english||"—"}</div><div class="mono">${s.math||"—"}</div><div class="mono">${s.reading||"—"}</div><div class="mono">${s.science||"—"}</div>
      <div><span class="pill ${s.composite>=st.actTargetPrimary?'green':s.composite>=27?'amber':'gray'}">${s.composite}</span></div>
      <div><button class="btn ghost sm" onclick="openActModal('${s.id}')">✎</button></div>
    </div>${s.note?`<div class="row" style="grid-template-columns:1fr;padding-top:0;border-top:none"><div class="muted" style="font-size:12px">📝 ${esc(s.note)}</div></div>`:""}`).join("")||`<div class="empty">No attempts logged.</div>`}
    </div>
  </div>`;
};
function openActModal(id){
  const s=id?STATE.actScores.find(x=>x.id===id):null; const isNew=!s; const d=s||{date:isoToday()};
  const body=`<div class="modal-head"><h3>${isNew?"Add ACT Attempt":"Edit ACT Attempt"}</h3><button class="x" onclick="closeModal()">✕</button></div>
  <div class="modal-body"><div class="form-grid">
    <div class="f"><label>Test date <span class="req">*</span></label><input id="af_date" type="date" value="${d.date||isoToday()}"></div>
    <div class="f"><label>Composite (auto if blank)</label><input id="af_comp" type="number" min="1" max="36" value="${d.composite??""}"></div>
    <div class="f"><label>English</label><input id="af_eng" type="number" min="1" max="36" value="${d.english??""}"></div>
    <div class="f"><label>Math</label><input id="af_math" type="number" min="1" max="36" value="${d.math??""}"></div>
    <div class="f"><label>Reading</label><input id="af_read" type="number" min="1" max="36" value="${d.reading??""}"></div>
    <div class="f"><label>Science</label><input id="af_sci" type="number" min="1" max="36" value="${d.science??""}"></div>
    <div class="f full"><label>Note</label><input id="af_note" type="text" value="${esc(d.note||"")}"></div>
  </div></div>
  <div class="modal-foot"><div>${id?`<button class="btn danger sm" onclick="deleteAct('${id}')">Delete</button>`:""}</div><div class="wrapflex"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveAct(${id?`'${id}'`:"null"})">${isNew?"Add":"Save"}</button></div></div>`;
  openModal(body);
}
function saveAct(id){ const g=x=>document.getElementById(x); const date=g("af_date").value; if(!date){toast("Date required");return;}
  const secs=["af_eng","af_math","af_read","af_sci"].map(x=>Number(g(x).value)||0);
  let comp=Number(g("af_comp").value)||0; const filled=secs.filter(Boolean); if(!comp&&filled.length) comp=Math.round(filled.reduce((a,b)=>a+b,0)/filled.length);
  const obj={date,english:secs[0],math:secs[1],reading:secs[2],science:secs[3],composite:comp,note:g("af_note").value};
  if(id) Object.assign(STATE.actScores.find(x=>x.id===id),obj); else STATE.actScores.push(Object.assign({id:uid("act"),sample:false},obj));
  saveState(); closeModal(); render(); toast(id?"Attempt updated":"Attempt added"); }
function deleteAct(id){ STATE.actScores=STATE.actScores.filter(x=>x.id!==id); saveState(); closeModal(); render(); toast("Attempt deleted"); }

VIEWS.financial=function(){
  const m=metrics();
  const bigCard=(lbl,val,sub,color)=>`<div class="card pad"><div class="lbl muted" style="font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em">${lbl}</div><div class="mono" style="font-size:26px;font-weight:730;margin-top:6px;${color?`color:${color}`:""}">${val}</div><div class="muted" style="font-size:12px;margin-top:3px">${sub}</div></div>`;
  const potential4yr=STATE.scholarships.filter(isActive).reduce((a,s)=>a+fourYearValue(s),0);
  const rows=STATE.colleges.map(c=>{
    const cost=STATE.costs[c.id]||{annual:"",years:4};
    const total=(Number(cost.annual)||0)*(Number(cost.years)||4);
    const after=Math.max(0,total-m.fourYearWon);
    return `<div class="row" style="grid-template-columns:1.4fr 130px 80px 130px 130px">
      <div style="font-weight:600">${esc(c.name)}</div>
      <div><input type="number" placeholder="annual $" value="${cost.annual}" onchange="setCost('${c.id}','annual',this.value)" style="width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:7px"></div>
      <div><input type="number" value="${cost.years||4}" onchange="setCost('${c.id}','years',this.value)" style="width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:7px"></div>
      <div class="mono" style="font-weight:600">${total?fmtMoney(total):"—"}</div>
      <div class="mono" style="font-weight:600;color:var(--good)">${total?fmtMoney(after):"—"}</div>
    </div>`;
  }).join("");
  return `<div class="page-head"><div><div class="t">Financial Impact</div><div class="d">What you've secured and what it means against college costs.</div></div></div>
  <div class="grid three" style="margin-bottom:16px">
    ${bigCard("Total Dollars Won",fmtMoney(m.dollarsWon),`${m.won} award(s) secured`,"var(--good)")}
    ${bigCard("Renewable Annual Awards",fmtMoney(m.renewableAnnual),"per year, if maintained")}
    ${bigCard("Est. 4-Year Scholarship Value (Won)",fmtMoney(m.fourYearWon),"won awards over 4 years")}
  </div>
  <div class="grid two" style="margin-bottom:16px">
    ${bigCard("Active Pipeline Potential",fmtMoney(potential4yr),"4-yr value of open opportunities","var(--brand)")}
    ${bigCard("Applications Submitted",m.submitted,"in the running")}
  </div>
  <div class="card">
    <div class="spread pad" style="padding-bottom:10px"><div class="section-title" style="margin:0">Estimated College Cost — Before vs After Scholarships</div></div>
    <div class="thead row" style="grid-template-columns:1.4fr 130px 80px 130px 130px"><div>College</div><div>Annual cost</div><div>Years</div><div>4-yr cost</div><div>After won $</div></div>
    <div class="rows">${rows||`<div class="empty">Add colleges to estimate costs.</div>`}</div>
  </div>
  <div class="notice" style="margin-top:16px">ℹ️ These are <b>estimates, not guaranteed amounts</b>. Enter each college's cost of attendance from its official net-price calculator. "After won $" applies your total won 4-year value against that college's cost for illustration; actual awards may be college-specific and are not guaranteed to renew.</div>`;
};
function setCost(id,field,val){ STATE.costs[id]=STATE.costs[id]||{annual:"",years:4}; STATE.costs[id][field]=val; saveState(); if(field!=="annual"&&field!=="years"){} render(); }

const SCHOOL_API = "https://universities.hipolabs.com/search"; // public, keyless, all U.S. institutions
async function remoteSchoolSearch(q){
  if(!q || q.trim().length<3) return [];
  try{
    const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),3500);
    const res=await fetch(SCHOOL_API+"?country=United%20States&name="+encodeURIComponent(q.trim()),{signal:ctrl.signal});
    clearTimeout(to);
    if(!res.ok) return [];
    const data=await res.json();
    return (data||[]).slice(0,50).map(d=>({name:d.name, st:(d["state-province"]||"").toString().split(",")[0].trim(), src:"live"}));
  }catch(e){ return []; }
}
function localSchoolSearch(q){
  q=(q||"").trim().toLowerCase(); if(!q) return [];
  const out=US_COLLEGES.filter(c=>c.lc.includes(q));
  out.sort((a,b)=>{ const as=a.lc.startsWith(q)?0:1,bs=b.lc.startsWith(q)?0:1; return as-bs || a.name.length-b.name.length; });
  return out.slice(0,30);
}

/* --- Typeahead controller (multiple instances by input id) --- */
const TA={};
function taInit(id,onpick){ TA[id]={onpick,items:[],seq:0}; }
function taInput(id){
  const inp=document.getElementById(id), box=document.getElementById(id+"_dd"); if(!inp||!box||!TA[id]) return;
  const q=inp.value; inp.dataset.st="";
  if(q.trim().length<1){ box.style.display="none"; box.innerHTML=""; return; }
  taRender(id, localSchoolSearch(q), false);
  const seq=++TA[id].seq; clearTimeout(TA[id].deb);
  TA[id].deb=setTimeout(async()=>{
    const remote=await remoteSchoolSearch(q);
    if(TA[id].seq!==seq) return;
    const local=localSchoolSearch(q); const seen=new Set(local.map(x=>x.lc));
    const merged=local.concat(remote.filter(r=>r.name && !seen.has(r.name.toLowerCase())));
    taRender(id, merged, true);
  },260);
}
function taRender(id,items,live){
  const box=document.getElementById(id+"_dd"); if(!box) return; TA[id].items=items;
  if(!items.length){ box.innerHTML=`<div class="ta-empty">No match yet${live?"":" · searching…"} — press <b>Enter</b> to add it exactly as typed.</div>`; box.style.display="block"; return; }
  box.innerHTML=items.map((it,i)=>`<div class="ta-item" onmousedown="event.preventDefault();taPick('${id}',${i})"><span class="ta-name">${esc(it.name)}</span>${it.st?`<span class="ta-st">${esc(it.st)}</span>`:""}</div>`).join("")
    + (live?"":`<div class="ta-live">Searching all U.S. schools…</div>`);
  box.style.display="block";
}
function taPick(id,i){ const it=TA[id].items[i]; const inp=document.getElementById(id); if(!it||!inp) return;
  inp.value=it.name; inp.dataset.st=it.st||""; document.getElementById(id+"_dd").style.display="none";
  if(TA[id].onpick) TA[id].onpick(it);
}
function taBlur(id){ setTimeout(()=>{const b=document.getElementById(id+"_dd"); if(b)b.style.display="none";},160); }

/* --- Match engine: how the student stacks up --- */
const WL_CAT={
  safety:{label:"Likely",cls:"green",blurb:"You're at or above this school's typical admitted range."},
  target:{label:"Target",cls:"blue",blurb:"You're in the competitive range — a realistic match."},
  reach:{label:"Reach",cls:"amber",blurb:"Below the typical range or highly selective — possible, not likely."},
  far:{label:"Far Reach",cls:"red",blurb:"Well below the typical range and/or extremely selective."},
  none:{label:"Add stats",cls:"gray",blurb:"Enter this school's admission stats to see your match."},
};
function schoolMatch(s){
  const p=STATE.profile; const gpa=Number(p.gpa)||0, act=Number(p.actComposite)||0;
  const avgGPA=Number(s.avgGPA)||0, actLow=Number(s.actLow)||0, actHigh=Number(s.actHigh)||0;
  const accept=(s.acceptRate!==""&&s.acceptRate!=null)?Number(s.acceptRate):null;
  if(!(avgGPA>0 || (actLow>0&&actHigh>0)) && accept===null) return {cat:"none"};
  const parts=[]; const scores=[];
  if(avgGPA>0){ const gs=Math.max(0,Math.min(1,(gpa-(avgGPA-0.5))/1.0)); scores.push(gs);
    parts.push({ok:gpa>=avgGPA, t:`Your GPA <b>${gpa}</b> vs. school average <b>${avgGPA}</b> — ${gpa>=avgGPA?"at or above average":"below average"}.`}); }
  if(actLow>0&&actHigh>0){ let as; if(act>=actHigh) as=1; else if(act<=actLow) as=Math.max(0,0.35-(actLow-act)*0.07); else as=0.35+(act-actLow)/(actHigh-actLow)*0.6; as=Math.max(0,Math.min(1,as)); scores.push(as);
    const pos=act>=actHigh?"at or above the top of":act>=actLow?"within":"below"; parts.push({ok:act>=actLow, t:`Your ACT <b>${act}</b> is ${pos} the middle-50% range (<b>${actLow}–${actHigh}</b>).`}); }
  const A=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:0.5;
  const sel=accept!==null?Math.max(0,Math.min(1,accept/100)):0.5;
  let chance=A*(0.5+0.5*sel);
  let cat = chance>=0.7?"safety":chance>=0.45?"target":chance>=0.25?"reach":"far";
  if(accept!==null&&accept<15&&cat==="safety") cat="target";
  if(accept!==null&&accept<8&&(cat==="safety"||cat==="target")) cat="reach";
  const score=Math.round(chance*100);
  if(accept!==null) parts.push({ok:true, t:`Acceptance rate <b>${accept}%</b> — ${accept<15?"extremely selective":accept<30?"very selective":accept<55?"selective":"less selective"}.`});
  const sugg=[];
  if(actLow>0&&act<actLow){ sugg.push(`Raising your ACT toward <b>${actLow}+</b> would move you into the competitive range.`);
    if((s.testPolicy||"").toLowerCase().includes("optional")) sugg.push(`This school is <b>test-optional</b> — if scores stay below range, a strong test-optional application may serve you better.`); }
  if(avgGPA>0&&gpa<avgGPA) sugg.push(`Protect and lift your GPA where possible, and highlight an upward grade trend.`);
  if(cat==="reach"||cat==="far") sugg.push(`For reaches, make essays, demonstrated interest, and standout activities do the heavy lifting.`);
  if(p.activities) parts.push({ok:true, t:`Beyond the numbers, your profile lists: ${esc(p.activities)}.`});
  return {cat,score,parts,sugg};
}

function myAcademicTags(){ const m=(STATE.profile.majors||[]).join(" ").toLowerCase(); const t=[];
  if(/health|nurs|exercise|kines|medic|therap|wellness|athletic/.test(m)) t.push("health");
  if(/eng|comp|tech|stem|scien|math|physic|bio|data/.test(m)) t.push("stem");
  if(/business|entrepr|market|manage|financ|econ/.test(m)) t.push("business");
  if(!t.length) t.push("liberalarts");
  return t; }

function prefFit(school){
  const p=STATE.prefs; const imp=p.importance||{}; const home=(STATE.profile.state||"").toUpperCase();
  const homeRegion=regionOf(home), schoolRegion=school.region; const acad=myAcademicTags();
  let num=0,den=0; const add=(key,sat)=>{ const w=(imp[key]??2)/4; if(w<=0) return; num+=w*sat; den+=w; };
  add("academics", acad.some(t=>school.tags.includes(t))?1:(school.tags.includes("research")||school.tags.includes("honors")?0.55:0.35));
  add("career", school.tags.includes("career")||school.tags.includes("business")||school.tags.includes("research")?0.85:0.5);
  add("research", school.tags.includes("research")?1:0.4);
  add("honors", school.tags.includes("honors")?1:0.5);
  add("athletics", school.tags.includes("bigathletics")?1:school.tags.includes("spirited")?0.7:0.3);
  add("campuslife", school.tags.includes("spirited")?0.9:(school.size==="L"?0.7:0.5));
  add("greek", school.tags.includes("greek")?1:0.4);
  add("diversity", (school.size==="L"||school.setting==="city")?0.75:0.55);
  add("faith", school.tags.includes("faith")?1:0.5);
  add("cost", (school.tags.includes("value")||school.control==="public")?0.85:0.5);
  let prox;
  if(p.distance==="instate") prox = school.st===home?1:(schoolRegion===homeRegion?0.4:0.12);
  else if(p.distance==="anywhere") prox = school.st===home?1:0.72;
  else prox = school.st===home?1:(schoolRegion===homeRegion?0.85:((ADJACENT[homeRegion]||[]).includes(schoolRegion)?0.5:0.2));
  add("proximity", prox);
  add("safety", (school.setting==="town"||school.setting==="suburban")?0.72:0.6);
  add("studyabroad", school.tags.includes("studyabroad")?1:0.55);
  let clim=0.6; if(p.climate==="warm") clim=school.warm?1:0.3; else if(p.climate==="cold") clim=school.warm?0.3:1; else if(p.climate==="four") clim=0.7;
  add("climate", clim);
  let mod=1;
  if(p.size!=="no_pref") mod += school.size==={small:"S",medium:"M",large:"L"}[p.size]?0.03:-0.04;
  if(p.setting!=="no_pref") mod += school.setting===p.setting?0.03:-0.04;
  if(p.control!=="no_pref") mod += school.control===p.control?0.03:-0.04;
  if(p.athleticsLevel==="d1") mod += school.tags.includes("bigathletics")?0.03:-0.05;
  mod=Math.max(0.88,Math.min(1.1,mod));
  const base=den?(num/den):0.5;
  // mild contrast so strong fits separate from average ones
  const score=Math.pow(base,1.25)*mod;
  return Math.max(0,Math.min(100,Math.round(score*100)));
}
function fitReasons(school){
  const p=STATE.prefs, imp=p.importance||{}, acad=myAcademicTags(), home=(STATE.profile.state||"").toUpperCase();
  const out=[];
  if(acad.some(t=>school.tags.includes(t))&&(imp.academics??2)>=2) out.push("Strong in your field");
  if(school.tags.includes("bigathletics")&&(imp.athletics??2)>=3) out.push("Big-time athletics");
  if(school.region===regionOf(home)&&(imp.proximity??2)>=2) out.push(school.st===home?"In your home state":"In your region");
  if((school.tags.includes("value")||school.control==="public")&&(imp.cost??2)>=3) out.push("Strong value");
  if(school.tags.includes("research")&&(imp.research??2)>=3) out.push("Research strength");
  if(school.tags.includes("greek")&&(imp.greek??1)>=3) out.push("Active Greek life");
  if(p.size!=="no_pref"&&school.size==={small:"S",medium:"M",large:"L"}[p.size]) out.push({small:"Small",medium:"Mid-size",large:"Large"}[p.size]+" campus");
  if(p.setting!=="no_pref"&&school.setting===p.setting) out.push({city:"City setting",suburban:"Suburban",town:"College town"}[p.setting]);
  if(p.climate==="warm"&&school.warm) out.push("Warm climate");
  return out.slice(0,4);
}

/* ---- Admissions Fit (qualitative, explained) ---- */
function admissionsFit(c){
  const p=STATE.profile; const act=Number(p.actComposite)||0; const gpa=Number(p.gpaUnweighted||p.gpa)||0;
  const accept=numOrNull(c.acceptRate), aL=Number(c.actLow)||0, aH=Number(c.actHigh)||0, cg=Number(c.avgGPA)||0;
  if(accept===null && !(aL&&aH) && !cg) return {tier:"INSUFFICIENT DATA",reasons:["No admission data yet — fetch from College Scorecard or enter the middle-50% test range, average GPA, and acceptance rate."]};
  const reasons=[]; let s=0,n=0;
  if(aL&&aH){ n++; if(act>=aH){s+=1;reasons.push(`Your ACT ${act} is at/above the reported 75th percentile (${aL}–${aH}).`);}
    else if(act>=aL){s+=0.55;reasons.push(`Your ACT ${act} sits within the middle 50% (${aL}–${aH}).`);}
    else {s+=0.12;reasons.push(`Your ACT ${act} is below the reported middle 50% (${aL}–${aH}).`);} }
  if(cg){ n++; if(gpa>=cg+0.1){s+=1;reasons.push(`Your GPA ${gpa} is above the average admitted GPA (~${cg}).`);}
    else if(gpa>=cg-0.2){s+=0.6;reasons.push(`Your GPA ${gpa} is competitive with the average admitted GPA (~${cg}).`);}
    else {s+=0.2;reasons.push(`Your GPA ${gpa} is below the average admitted GPA (~${cg}).`);} }
  const standing=n?s/n:0.5; let idx=Math.round((1-standing)*3), selBump=0;
  if(accept!==null){ if(accept<8)selBump=2;else if(accept<15)selBump=1.5;else if(accept<25)selBump=1;else if(accept<40)selBump=0.5;else if(accept<60)selBump=0;else selBump=-0.5;
    reasons.push(`Overall acceptance rate is ${accept}% — ${accept<10?"extremely selective":accept<25?"very selective":accept<45?"selective":"less selective"}.`); }
  else reasons.push("Acceptance rate not yet verified.");
  if(p.rigor) reasons.push(`Your course rigor: ${p.rigor}.`);
  idx=Math.max(0,Math.min(4,Math.round(idx+selBump)));
  const evidence=[{k:"ACT range",ok:!!(aL&&aH)},{k:"Admission rate",ok:accept!==null},{k:"Avg GPA / distribution",ok:!!cg}];
  const used=evidence.filter(e=>e.ok).length;
  reasons.push(`Assessment based on ${used} of ${evidence.length} academic indicators${evidence.filter(e=>!e.ok).length?" (unavailable: "+evidence.filter(e=>!e.ok).map(e=>e.k).join(", ")+")":""}.`);
  return {tier:["LIKELY","TARGET","HIGH TARGET","REACH","HIGH REACH"][idx],standing,reasons,evidence};
}

/* ---- College Fit Score (0-100, customizable weights) ---- */
function estTotalCost(c){ const k=c.cost||{}; const parts=["tuition","fees","housing","meals","books","travel"].map(f=>Number(k[f])||0); const sum=parts.reduce((a,b)=>a+b,0); if(sum>0) return sum;
  const home=(STATE.profile.state||"").toUpperCase(); if(c.state===home&&Number(k.inState)) return Number(k.inState); if(Number(k.outState)) return Number(k.outState); return null; }
function estNetCost(c){ const t=estTotalCost(c); if(t===null) return null; const k=c.cost||{}; const aid=["instMerit","outsideSch","grants","otherAid"].reduce((a,f)=>a+(Number(k[f])||0),0); return Math.max(0,t-aid); }
function meritPotential(c){ let s=42; const m=c.merit||{}; if(m.auto)s+=20; if(m.competitive)s+=14; if(m.fullTuition)s+=16; if(m.fullRide)s+=10; if(m.honors)s+=6; if(c.control==="public")s+=6; const a=numOrNull(c.acceptRate); if(a!==null&&a<15)s-=18; return Math.max(5,Math.min(100,s)); }
function hasAdmissionsData(c){ return numOrNull(c.acceptRate)!==null || (Number(c.actLow)&&Number(c.actHigh)) || Number(c.avgGPA)>0; }
/* Build fit sub-scores ONLY from fields that actually have data — never assume. */
function fitComponents(c){
  const p=STATE.profile,pr=STATE.prefs||defaultPrefs(); const home=(p.state||"").toUpperCase(),reg=regionOf(c.state),homeReg=regionOf(home);
  const sat={},av={};
  const af=admissionsFit(c); if(af.standing!==undefined){ sat.academic=af.standing; av.academic=1; }
  if(c.majors){ const ml=c.majors.toLowerCase(); sat.major=/exercise|kines|health|nurs|therap|biolog|athletic|wellness/.test(ml)?1:0.4; sat.career=sat.major; av.major=1; av.career=1; }
  const net=estNetCost(c); if(net!==null){ sat.cost=Math.max(0,Math.min(1,1-net/60000)); av.cost=1; }
  if(c.merit&&(c.merit.auto||c.merit.competitive||c.merit.fullTuition||c.merit.fullRide||c.merit.maxFourYear)){ sat.merit=meritPotential(c)/100; av.merit=1; }
  if(c.state){ sat.location=(pr.prefStates&&pr.prefStates.includes(c.state))?1:(reg===homeReg?0.8:0.5); av.location=1;
    sat.distance=c.state===home?1:(reg===homeReg?0.8:((ADJACENT[homeReg]||[]).includes(reg)?0.5:0.25)); av.distance=1; }
  if(c.size){ sat.size=pr.size==="no_pref"?0.6:(c.size==={small:"S",medium:"M",large:"L"}[pr.size]?1:0.4); av.size=1; }
  if(c.setting){ sat.setting=pr.setting==="no_pref"?0.6:(c.setting===pr.setting?1:0.45); av.setting=1; }
  if(Number(c.gradRate)){ sat.gradrate=Number(c.gradRate)/100; sat.outcomes=Math.min(1,Number(c.gradRate)/100*1.05); av.gradrate=1; av.outcomes=1; }
  const rate=(Number(c.studentRating)||0)+(Number(c.parentRating)||0); if(rate){ sat.rating=Math.min(1,rate/10); av.rating=1; }
  return {sat,av};
}
function fitCoverage(c){ const {av}=fitComponents(c); return {used:FIT_DIMS.filter(d=>av[d.k]).length,total:FIT_DIMS.length}; }
function collegeFitScore(c){ if(!hasAdmissionsData(c)) return null; const w=STATE.settings.fitWeights||DEFAULT_FIT_WEIGHTS; const {sat,av}=fitComponents(c);
  let num=0,den=0,used=0; FIT_DIMS.forEach(d=>{ if(!av[d.k])return; const ww=Number(w[d.k])||0; if(ww<=0)return; num+=ww*sat[d.k]; den+=ww; used++; });
  if(used<3||den<=0) return null; return Math.round(num/den*100); }
function cfDisplay(c){ const s=collegeFitScore(c); if(s===null) return `<span class="pill gray" title="Needs verified admissions data">Fit —</span>`; return cfChip(s); }
/* Profile completeness (distinguishes loaded vs. still-needs-research) */
function dataCompleteness(c){
  const cats=[
    ["Institution identity", !!(c.name&&(c.state||c.location))],
    ["Admissions statistics", hasAdmissionsData(c)],
    ["Enrollment", !!c.enrollment],
    ["Cost", estTotalCost(c)!==null],
    ["Outcomes (grad rate)", !!c.gradRate],
    ["Current application requirements", !!(c.req.platform||c.req.teacherRecs||c.req.counselorRec)],
    ["Current deadlines", Object.values(c.deadlines).some(Boolean)],
    ["Merit scholarships", !!(c.merit.auto||c.merit.competitive||c.merit.maxFourYear||c.merit.signature)],
    ["Common Data Set (what they value)", Object.values(c.value||{}).some(v=>v&&v!=="NOT REPORTED")],
    ["Career pathway verification", !!(c.majors||c.pt.exSci||c.pt.dpt||c.pt.kines)],
  ];
  const done=cats.filter(x=>x[1]).length; return {cats,done,total:cats.length,pct:Math.round(done/cats.length*100)};
}

function listBalance(){
  const groups={"LIKELY":[],"TARGET":[],"HIGH TARGET":[],"REACH":[],"HIGH REACH":[],"INSUFFICIENT DATA":[]};
  STATE.schools.forEach(c=>{ if(["DENIED","WITHDRAWN"].includes(c.status)) return; groups[admissionsFit(c).tier].push(c); });
  const warnings=[];
  const active=STATE.schools.filter(c=>!["DENIED","WITHDRAWN"].includes(c.status));
  if(groups["LIKELY"].length===0 && active.length) warnings.push("You may want to add another Likely school as an anchor.");
  const reachy=groups["REACH"].length+groups["HIGH REACH"].length;
  if(active.length && reachy/active.length>0.5) warnings.push("Most of your list is highly selective — balance it with more Target and Likely schools.");
  const anyAffordable=active.some(c=>{const n=estNetCost(c);return n!==null&&n<25000;});
  if(active.length && !anyAffordable) warnings.push("You have no clear financial safety yet — add a school with a confirmed affordable net cost.");
  if(groups["INSUFFICIENT DATA"].length) warnings.push(`${groups["INSUFFICIENT DATA"].length} school(s) need admission data before they can be classified.`);
  return {groups,warnings};
}

function appBucket(c){ const s=c.status;

  if(["APPLIED","FINALIST","ENROLLED"].includes(s))return"Submitted"; if(s==="READY")return"Ready to Submit";
